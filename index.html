<!DOCTYPE html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pixel Shooter - Roguelike Dungeon Expansion</title>
<meta name="description" content="Shooter roguelike estilo The Binding of Isaac con cooperativo online y mazmorras procedurales">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --gold:#ffd23f;
  --gold-glow:rgba(255,210,63,0.45);
  --cy:#7df9ff;
  --cy-glow:rgba(125,249,255,0.4);
  --mg:#ff4d9d;
  --purp:#a855f7;
  --purp-glow:rgba(168,85,247,0.4);
  --bg-dark:#080a14;
  --bg-card:linear-gradient(145deg,rgba(28,34,75,0.92),rgba(12,15,38,0.95));
  --border-neon:rgba(125,249,255,0.3);
}
html,body{height:100%;margin:0;background:radial-gradient(ellipse at 50% 25%,#151a42,#05070f 80%);font-family:'Press Start 2P',monospace;color:#fff;overflow:hidden;-webkit-user-select:none;user-select:none}
body{display:flex;align-items:center;justify-content:center}
#w{position:relative;width:100%;max-width:calc((100vh - 20px)*16/9);container-type:inline-size;box-shadow:0 0 0 .4cqw #070914,0 0 5cqw rgba(90,60,255,0.35);border-radius:2px;overflow:hidden}
html:fullscreen #w,html:-webkit-full-screen #w{max-width:calc(100vh*16/9);border-radius:0}
canvas#c{display:block;image-rendering:pixelated;width:100%;aspect-ratio:16/9;background:#000;cursor:none;touch-action:none}
#hud{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
#w.crt::after{content:'';position:absolute;inset:0;pointer-events:none;z-index:4;background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,transparent 1px 3px),radial-gradient(ellipse at center,transparent 65%,rgba(0,0,0,.55))}
#fs{position:absolute;top:1cqw;right:1cqw;z-index:6;margin:0;padding:.5cqw .9cqw;font-size:max(10px,1.8cqw);background:rgba(15,20,45,0.8);border:1px solid var(--cy);color:var(--cy);border-radius:4px;cursor:pointer;transition:.15s}
#fs:hover{background:var(--cy);color:#080a14;box-shadow:0 0 1.5cqw var(--cy)}

/* UI Overlay */
#ui{position:absolute;inset:0;display:none;align-items:center;justify-content:center;overflow:hidden;background:radial-gradient(ellipse at 50% 30%,rgba(30,22,80,.88),rgba(4,6,18,.96));backdrop-filter:blur(6px);z-index:10}
#ui.on{display:flex}
#ui::before{content:'';position:absolute;inset:-30%;background:radial-gradient(circle at 75% 70%,rgba(255,77,157,.18),transparent 45%),radial-gradient(circle at 20% 25%,rgba(125,249,255,.18),transparent 45%),radial-gradient(circle at 50% 50%,rgba(168,85,247,.12),transparent 55%);animation:neb 12s ease-in-out infinite alternate}
@keyframes neb{to{transform:translate(3cqw,-2.5cqw) scale(1.1)}}
#fx{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.stl{position:absolute;left:0;top:0;animation:drift linear infinite}
@keyframes drift{to{transform:translateY(-56cqw)}}
#uic{position:relative;z-index:2;width:100%;height:100%;display:flex;align-items:center;justify-content:center;overflow:auto}
::-webkit-scrollbar{width:.7cqw;height:.7cqw}::-webkit-scrollbar-thumb{background:#4a5b9c;border-radius:2px}::-webkit-scrollbar-track{background:#0a0d1e}

/* Paneles y tarjetas */
.p{position:relative;background:var(--bg-card);padding:2cqw 2.4cqw;max-width:94%;max-height:94%;overflow:auto;text-align:center;font-size:max(8px,1.2cqw);line-height:1.75;box-shadow:0 0 0 .25cqw #070914,0 0 0 .5cqw var(--gold),0 0 0 .75cqw #070914,0 0 4cqw var(--gold-glow),inset 0 0 3cqw rgba(0,0,0,.7);border-radius:4px;animation:pin .2s ease-out}
@keyframes pin{from{opacity:0;transform:translateY(1.2cqw) scale(.98)}}
.p h2{display:flex;align-items:center;justify-content:center;gap:1cqw;margin:0 0 1.2cqw;font-size:max(11px,1.9cqw);font-weight:normal;color:var(--gold);text-shadow:.25cqw .25cqw 0 #000,0 0 1.5cqw var(--gold);letter-spacing:.12cqw}
.p h2::before,.p h2::after{content:'◆';font-size:.65em;color:var(--cy);text-shadow:0 0 1cqw var(--cy)}
small{font-size:.72em;opacity:.85;letter-spacing:.04cqw}

/* Botones Modernizados */
button{position:relative;font-family:inherit;font-size:max(8px,1.15cqw);color:#fff;background:linear-gradient(180deg,#3b4a80,#202952);border:0;padding:.8cqw 1.4cqw;margin:.25cqw;cursor:pointer;box-shadow:0 0 0 2px #070914,inset 0 2px 0 rgba(175,195,255,.4),inset 0 -2px 0 rgba(10,14,35,.8),0 .3cqw 0 2px #070914;border-radius:3px;transition:transform .08s,filter .15s,box-shadow .15s}
button:hover,button:focus-visible{filter:brightness(1.25);transform:translateY(-2px);outline:none;box-shadow:0 0 0 2px #070914,inset 0 2px 0 rgba(200,220,255,.6),0 .3cqw 0 2px #070914,0 0 1.6cqw var(--cy-glow)}
button:active{transform:translateY(2px)}
button.s{background:linear-gradient(180deg,#ffd23f,#e08500);color:#241500;box-shadow:0 0 0 2px #070914,inset 0 2px 0 #fff4b8,inset 0 -3px 0 #945300,0 .3cqw 0 2px #070914}
button.s:hover,button.s:focus-visible{box-shadow:0 0 0 2px #070914,inset 0 2px 0 #fff9d6,0 .3cqw 0 2px #070914,0 0 2cqw var(--gold-glow)}
button.purp{background:linear-gradient(180deg,#c084fc,#7e22ce);color:#fff;box-shadow:0 0 0 2px #070914,inset 0 2px 0 #e9d5ff,inset 0 -3px 0 #581c87,0 .3cqw 0 2px #070914}
button.purp:hover,button.purp:focus-visible{box-shadow:0 0 0 2px #070914,0 0 2cqw var(--purp-glow)}
button:disabled{opacity:.45;filter:grayscale(.7);cursor:not-allowed;transform:none}
button.tab{background:#121633;box-shadow:0 0 0 2px #070914;color:#9aa5c8}
button.tab.on{background:linear-gradient(180deg,#2b376b,#1a224a);color:var(--gold);box-shadow:0 0 0 2px #070914,0 .35cqw 0 0 var(--gold)}
button.tg{min-width:6cqw}button.tg.on{background:linear-gradient(#38d66b,#1a8f3d);color:#04200c}

/* Inputs */
input[type=text]{font-family:inherit;background:#080a17;border:2px solid #4a5c94;color:#fff;padding:.65cqw .85cqw;font-size:max(8px,1.1cqw);box-shadow:inset 0 .25cqw 0 #000a;border-radius:3px;outline:none;transition:border-color .15s}
input[type=text]:focus{border-color:var(--cy);box-shadow:inset 0 .25cqw 0 #000a,0 0 1.2cqw var(--cy-glow)}
input[type=range]{-webkit-appearance:none;appearance:none;width:18cqw;height:1.2cqw;background:linear-gradient(90deg,var(--cy) var(--v,50%),#080a17 var(--v,50%));border:2px solid #3a4a8a;vertical-align:middle;outline:none;margin:0 1cqw;border-radius:2px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:1.5cqw;height:2.2cqw;background:var(--gold);border:2px solid #070914;box-shadow:0 0 1cqw var(--gold);cursor:pointer}
input[type=range]::-moz-range-thumb{width:1.5cqw;height:2.2cqw;background:var(--gold);border:2px solid #070914;border-radius:0}

/* Filas y utilidades */
.r{margin:.7cqw 0}
.row{display:flex;align-items:center;justify-content:space-between;gap:1.6cqw;margin:.7cqw 0;padding:.7cqw 1.2cqw;background:#080b1e88;border-left:.35cqw solid var(--cy);border-radius:2px;text-align:left}
.row b{color:var(--gold);font-weight:normal;min-width:4.5cqw;text-align:right}
.sw{display:inline-block;width:max(16px,2cqw);height:max(16px,2cqw);border:2px solid #070914;margin:.2cqw;cursor:pointer;box-shadow:0 0 0 2px #3a4a8a;transition:transform .1s}
.sw:hover{transform:scale(1.15)}.sw.s{box-shadow:0 0 0 2px #fff,0 0 1.2cqw #fff}
kbd{display:inline-block;background:linear-gradient(#fff,#cfd6ee);color:#161a36;padding:.25cqw .5cqw;margin-right:.4cqw;box-shadow:0 .2cqw 0 #6a74a8,0 0 0 2px #070914;border-radius:2px;font-family:inherit}

/* ---- MENU PRINCIPAL REDISEÑADO & COMPACTO (16:9 PERFECTO) ---- */
.mm{display:flex;flex-direction:column;width:100%;height:100%;padding:1cqw 2.2cqw .8cqw;box-sizing:border-box;position:relative;justify-content:space-between;overflow:hidden}
.header-row{display:flex;justify-content:space-between;align-items:center;width:100%;flex-shrink:0}
.logo{margin:0;font-weight:normal;font-size:max(15px,3.8cqw);line-height:1.02;filter:drop-shadow(.25cqw .25cqw 0 #070914) drop-shadow(0 0 1.6cqw rgba(90,60,255,.8))}
.logo .l1,.logo .l2{display:inline-block;margin-right:.4cqw}
.logo span span{display:inline-block;animation:wave 2.6s ease-in-out infinite;animation-delay:calc(var(--i)*.08s);-webkit-background-clip:text;background-clip:text;color:transparent}
.logo .l1 span{background-image:linear-gradient(#fff 5%,#7df9ff 50%,#3b82f6)}
.logo .l2 span{background-image:linear-gradient(#fff8b8 5%,#ffd23f 45%,#ff4d9d)}
@keyframes wave{50%{transform:translateY(-.4cqw)}}
.badge-ver{display:inline-block;background:linear-gradient(90deg,#7e22ce,#ec4899);color:#fff;font-size:max(5.5px,.68cqw);padding:.25cqw .6cqw;border-radius:3px;box-shadow:0 0 1cqw rgba(236,72,153,.5);letter-spacing:.08cqw}
.sub{font-size:max(5.8px,.75cqw);color:#9ad1ff;letter-spacing:.12cqw;margin-top:.3cqw;text-shadow:1px 1px 0 #000}

/* Grilla del Menú */
.cols{display:grid;grid-template-columns:33cqw 20cqw 1fr;gap:1.6cqw;margin:.7cqw 0;flex:1;min-height:0;align-items:stretch}
.nav{display:flex;flex-direction:column;gap:.35cqw;justify-content:space-between}

/* Tarjeta Destacada de Mazmorras */
.hero-mode{position:relative;background:linear-gradient(135deg,#351563,#160e33);border:2px solid var(--purp);box-shadow:0 0 0 2px #070914,0 0 1.8cqw var(--purp-glow);padding:.65cqw 1cqw;text-align:left;cursor:pointer;transition:transform .12s,box-shadow .2s;border-radius:3px;overflow:hidden;animation:slidein .4s ease-out backwards}
.hero-mode:hover{transform:translateY(-2px);box-shadow:0 0 0 2px #070914,0 0 2.5cqw rgba(168,85,247,.7);filter:brightness(1.15)}
.hero-mode::before{content:'★ NUEVO MODO ★';position:absolute;top:0;right:0;background:linear-gradient(90deg,#ff4d9d,#ffd23f);color:#070914;font-size:max(4.5px,.56cqw);padding:.18cqw .5cqw;border-bottom-left-radius:3px;font-weight:bold}
.hero-mode b{display:block;font-size:max(7.5px,1.15cqw);color:var(--gold);text-shadow:0 0 1cqw var(--gold)}
.hero-mode small{display:block;margin-top:.2cqw;font-size:max(5.2px,.66cqw);color:#e2d9fc;line-height:1.3}
.hero-tags{display:flex;gap:.35cqw;margin-top:.35cqw}
.hero-tags span{background:#110b26;border:1px solid #7e22ce;color:#c084fc;font-size:max(4.5px,.55cqw);padding:.1cqw .35cqw;border-radius:2px}

.mb{display:block;width:100%;text-align:left;margin:0;padding:.52cqw 1cqw;overflow:hidden;animation:slidein .45s ease-out backwards;animation-delay:calc(var(--i)*.04s + .1s)}
.mb b{display:block;font-weight:normal;font-size:max(7.2px,1.08cqw)}
.mb small{display:block;margin-top:.16cqw;font-size:max(5.2px,.64cqw);opacity:.85;line-height:1.2}
.mb::before{content:'▶';position:absolute;right:.9cqw;top:50%;transform:translateY(-50%) translateX(-.5cqw);opacity:0;transition:.15s;color:var(--gold)}
.mb.s::before{color:#2a1a00}
.mb:hover::before,.mb:focus-visible::before{opacity:1;transform:translateY(-50%)}
@keyframes slidein{from{opacity:0;transform:translateX(-3.5cqw)}}

/* Tarjeta del Jugador */
.pc{background:linear-gradient(160deg,#181e46,#0b0e26);box-shadow:0 0 0 2px #070914,0 0 0 3px #3b4a8a,0 0 1.8cqw rgba(125,249,255,.2);padding:.75cqw;display:flex;flex-direction:column;align-items:center;gap:.4cqw;border-radius:3px;justify-content:space-between;animation:slidein .5s ease-out .15s backwards}
.pc input{width:100%;box-sizing:border-box;text-align:center;padding:.35cqw;font-size:max(6.5px,.95cqw)}
.pc button{margin:0;width:100%;padding:.55cqw}
.pcv{position:relative;width:9.5cqw;height:9.5cqw;display:flex;align-items:flex-end;justify-content:center}
.pcv::after{content:'';position:absolute;bottom:.2cqw;width:7cqw;height:1.2cqw;background:radial-gradient(ellipse,#7df9ff66,transparent 70%)}
.pcv canvas{width:8cqw;height:9cqw;image-rendering:pixelated;animation:float 2.4s ease-in-out infinite;position:relative;z-index:1}
@keyframes float{50%{transform:translateY(-.5cqw)}}
.gear{display:flex;gap:.5cqw}
.gs{width:3.5cqw;height:3.5cqw;background:#080a17;border:2px solid #3b4a8a;border-radius:2px;display:flex;align-items:center;justify-content:center}
.gs canvas{width:2.9cqw;height:2.9cqw;image-rendering:pixelated}.gs span{opacity:.4}
.pst{display:flex;gap:.6cqw;width:100%;justify-content:space-between;font-size:max(5.8px,.78cqw)}
.pst b{display:block;color:var(--gold);font-weight:normal;margin-top:.15cqw}

/* Tarjeta de Controles */
.info{background:linear-gradient(160deg,#121738cc,#0a0d22cc);border:1px solid #3a4a8a;border-radius:3px;padding:.7cqw .9cqw;display:flex;flex-direction:column;justify-content:space-between;gap:.25cqw;font-size:max(5.2px,.72cqw);color:#cfe8ff;text-align:left;align-self:stretch}
.info-title{color:var(--cy);font-size:max(5.8px,.8cqw);border-bottom:1px solid #2d3866;padding-bottom:.25cqw;margin-bottom:.2cqw;letter-spacing:.08cqw}
.info div{display:flex;align-items:center;justify-content:space-between}

/* Footer / Consejos Ticker */
.tick{display:flex;align-items:center;justify-content:center;width:100%;box-sizing:border-box;font-size:max(5.6px,.75cqw);color:var(--gold);background:rgba(8,11,28,0.85);border:1px solid #3a4a8a;border-radius:3px;padding:.4cqw .9cqw;flex-shrink:0;animation:tipin .4s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@keyframes tipin{from{opacity:0;transform:translateY(.4cqw)}}

/* Modales y Paneles Específicos */
.vlist{display:flex;flex-direction:column;gap:.6cqw;min-width:28cqw}.vlist button{margin:0;width:100%}
.stats{display:flex;gap:.9cqw;justify-content:center;margin:0 0 1.2cqw;flex-wrap:wrap}
.stats>div{background:#080b1e;border:2px solid #3a4a8a;padding:.6cqw 1.1cqw;min-width:7cqw;border-radius:3px}
.stats small{display:block;margin-bottom:.25cqw}.stats b{font-size:1.35em;color:var(--gold);font-weight:normal}
.glitch{margin:0 0 1.2cqw;font-size:max(16px,4cqw);font-weight:normal;color:#ff4d6d;position:relative;text-shadow:.35cqw .35cqw 0 #000}
.glitch::before,.glitch::after{content:attr(data-t);position:absolute;left:0;top:0;width:100%}
.glitch::before{color:var(--cy);clip-path:inset(0 0 55% 0);animation:gl1 2.5s infinite}
.glitch::after{color:var(--mg);clip-path:inset(55% 0 0 0);animation:gl2 2.5s infinite}
@keyframes gl1{0%,88%,100%{transform:translate(-.3cqw,0)}92%{transform:translate(.8cqw,-.2cqw)}96%{transform:translate(-.8cqw,.2cqw)}}
@keyframes gl2{0%,88%,100%{transform:translate(.3cqw,0)}92%{transform:translate(-.8cqw,.2cqw)}96%{transform:translate(.8cqw,-.2cqw)}}
.nr{color:var(--gold);animation:blink .8s steps(2) infinite;margin-bottom:.7cqw}@keyframes blink{50%{opacity:.2}}

/* Tienda & Objetos */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1cqw;margin:1cqw 0}
.it{position:relative;background:linear-gradient(160deg,#202750,#121634);border:2px solid var(--rc,#3a4a8a);box-shadow:0 0 0 2px #070914;padding:1cqw .8cqw;display:flex;flex-direction:column;align-items:center;gap:.5cqw;border-radius:3px;transition:transform .12s,box-shadow .2s;min-width:13cqw}
.it:hover{transform:translateY(-3px);box-shadow:0 0 0 2px #070914,0 0 1.8cqw var(--rc,#7df9ff)}
.it.eq{box-shadow:0 0 0 2px #070914,0 0 0 3px var(--gold),0 0 1.8cqw var(--gold-glow)}
.it .nm{font-weight:normal;color:#fff;font-size:.95em}.it .ds{font-size:.7em;opacity:.85;min-height:2.3em;line-height:1.35}
.it button{margin:0;width:100%}
.rb{position:absolute;top:0;left:0;background:var(--rc);color:#070914;font-size:.5em;padding:.2cqw .5cqw;border-bottom-right-radius:3px}
.ic{width:5.5cqw;height:5.5cqw;image-rendering:pixelated;filter:drop-shadow(0 0 .5cqw var(--rc,#7df9ff))}
.sr{width:100%;text-align:left}.sr small{display:block;font-size:.55em;margin-bottom:.15cqw}
.st{height:.75cqw;background:#080a17;width:100%;border:1px solid #3a4a8a;border-radius:2px;overflow:hidden}.st i{display:block;height:100%;background:linear-gradient(90deg,var(--cy),#3a86ff);transition:width .3s}
.pips{color:#9ad1ff;letter-spacing:.2cqw;font-size:.85em}
.coins{display:inline-flex;align-items:center;gap:.6cqw;background:#080a18bb;border:2px solid var(--gold);padding:.4cqw 1cqw;color:var(--gold);border-radius:3px;margin-bottom:.7cqw}
.coins::before{content:'';width:1.2cqw;height:1.2cqw;background:linear-gradient(135deg,#fff5a0,#ffb300);box-shadow:0 0 1cqw var(--gold)}
.tabs{margin-bottom:.4cqw}

/* Avatar modal */
.av2{display:flex;gap:2.2cqw;align-items:center;justify-content:center}.av2 .pcv{width:14cqw;height:16cqw}.av2 .pcv canvas{width:11cqw;height:13cqw}
.opts{text-align:left}

/* Modo Online & Salas */
.duo{display:grid;grid-template-columns:repeat(3,1fr);gap:1.2cqw;margin:1cqw 0;justify-content:center}
.big{display:flex;flex-direction:column;align-items:center;gap:.6cqw;padding:1.4cqw 1cqw;margin:0;border-radius:4px;text-align:center}
.big .em{font-size:3cqw}.big b{font-weight:normal;font-size:1.05em}.big small{line-height:1.45;font-size:.68em;opacity:.85}
.rm{display:flex;align-items:center;gap:1.2cqw;background:#080b1ecc;border-left:.35cqw solid #38d66b;padding:.6cqw 1cqw;margin:.4cqw 0;text-align:left;border-radius:2px}
.rm .rn{flex:1}.rm .pp{color:#38d66b;letter-spacing:.12cqw}.rm button{margin:0}
.rm.full{border-left-color:#ff4d6d}.rm.full .pp{color:#ff4d6d}
#rl{max-height:18cqw;overflow:auto;min-width:42cqw}
.mk{display:flex;gap:.7cqw;align-items:center;justify-content:center}
.load{display:flex;gap:.6cqw;justify-content:center;margin:1.2cqw 0}.load i{width:1.3cqw;height:1.3cqw;background:var(--gold);animation:ld 1s infinite;border-radius:2px}
.load i:nth-child(2){animation-delay:.15s;background:var(--cy)}.load i:nth-child(3){animation-delay:.3s;background:var(--mg)}.load i:nth-child(4){animation-delay:.45s;background:#38d66b}
@keyframes ld{50%{transform:translateY(-1cqw)}}
.win{font-size:1.15em;color:var(--gold);margin:0 0 .8cqw;text-shadow:0 0 1.2cqw var(--gold)}.win small{color:#fff}
.lb{display:inline-block;min-width:26cqw;margin-bottom:.8cqw}
.lbr{display:flex;gap:1cqw;align-items:center;padding:.4cqw .8cqw;background:#080b1e88;margin:.2cqw 0;text-align:left;border-radius:2px}.lbr .nm{flex:1}.lbr b{color:var(--gold);font-weight:normal}.lbr.me{outline:2px solid var(--cy)}
.vt{color:var(--gold);font-weight:normal}
.mp{position:relative;width:100%;height:4.8cqw;border:2px solid #070914;overflow:hidden;border-radius:2px}
.mp::before{content:'';position:absolute;left:12%;top:18%;width:.8cqw;height:.8cqw;background:var(--t);box-shadow:3cqw 1cqw 0 var(--t),6cqw 3cqw 0 var(--t),1cqw 3cqw 0 var(--t),9cqw 1cqw 0 var(--t),11cqw 3.4cqw 0 var(--t)}
.mp::after{content:'';position:absolute;right:8%;bottom:10%;width:3cqw;height:1.6cqw;background:var(--w)}

/* ---- MENU PRINCIPAL: version grande ---- */
.mm{padding:1.4cqw 2.6cqw 1cqw}
.logo{font-size:max(22px,5.6cqw)}
.sub{font-size:max(7px,1.15cqw);margin-top:.6cqw;letter-spacing:.14cqw}
.badge-ver{font-size:max(7px,1cqw);padding:.5cqw 1cqw}

};

// PRNG para generación procedural determinista en mazmorras
function mulberry32(a) {
  return function() {
    let t = a += 0x6D2B79F5;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;

];
const m = new Uint8Array(MW * MH); let pal = PAL[0];

function genMap(sd, pi, wd){
  pal = PAL[pi]; door = null;
  for(let y = 0; y < MH; y++) for(let x = 0; x < MW; x++){
    const ed = x < 1 || y < 1 || x >= MW - 1 || y >= MH - 1;
    m[y * MW + x] = ed || hash(x + sd * 97, y + sd * 53) < .07 ? 1 : 0;
  }
  for(let i = 0; i < 16; i++){
    const cx = 6 + hash(i + sd * 13, 99) * (MW - 12), cy = 6 + hash(i + sd * 13, 77) * (MH - 12);
    const rx = 2 + hash(i, 5 + sd) * 3, ry = 2 + hash(i, 6 + sd) * 2.5;
    for(let y = 1; y < MH - 1; y++) for(let x = 1; x < MW - 1; x++)
      if(((x - cx) / rx) ** 2 + ((y - cy) / ry) ** 2 < 1) m[y * MW + x] = 2;
  }
  for(let y = 0; y < MH; y++) for(let x = 0; x < MW; x++)
    if(Math.hypot(x - MW / 2, y - MH / 2) < 4) m[y * MW + x] = 0;
  if(wd) mkDoor(sd);
}

function mkDoor(sd){
  const side = Math.floor(hash(sd, 3) * 4), r_ = hash(sd, 4); let tx, ty, nx, ny;
  if(side < 2){
    tx = 8 + Math.floor(r_ * (MW - 16)); ty = side ? MH - 1 : 0; nx = tx; ny = side ? MH - 2 : 1;
  } else {
    ty = 8 + Math.floor(r_ * (MH - 16)); tx = side == 2 ? 0 : MW - 1; nx = side == 2 ? 1 : MW - 2; ny = ty;
  }
  m[ty * MW + tx] = 3;
  for(let y = -2; y <= 2; y++) for(let x = -2; x <= 2; x++){
    const X = nx + x, Y = ny + y; if(X > 0 && Y > 0 && X < MW - 1 && Y < MH - 1) m[Y * MW + X] = 0;
  }
  let cx = MW >> 1, cy = MH >> 1;
  while(cx !== nx){ cx += cx < nx ? 1 : -1; if(m[cy * MW + cx] !== 3) m[cy * MW + cx] = 0; }
  while(cy !== ny){ cy += cy < ny ? 1 : -1; if(m[cy * MW + cx] !== 3) m[cy * MW + cx] = 0; }
  door = { tx, ty, x: tx * T + 8, y: ty * T + 8 };
}

function genDungeon(floor, sd){
  const pr = mulberry32(sd);
  const thIdx = (floor - 1) % DUN_THEMES.length;
  const th = DUN_THEMES[thIdx];
  const numRooms = 8 + floor * 3; // Muchas habitaciones: 11 en P1, 14 en P2, 17 en P3...
  const rooms = {};
  
  // Sala inicial
  rooms['0,0'] = {
    x: 0, y: 0, type: 'start', cleared: true, visited: true,
    doors: {}, obs: [], w: RW, h: RH, ep: []
  };
  const list = [{x: 0, y: 0}];

  while(Object.keys(rooms).length < numRooms){
    const par = list[Math.floor(pr() * list.length)];
    const d = DIRS[Math.floor(pr() * DIRS.length)];
    const nx = par.x + d.dx, ny = par.y + d.dy, key = `${nx},${ny}`;
    if(!rooms[key]){
      // Salas de tamaño regular o salas grandes (1x1 o 2x1)
      const isBig = pr() < 0.2 && Object.keys(rooms).length > 2;
      rooms[key] = {
        x: nx, y: ny, type: 'combat', cleared: false, visited: false,
        doors: {}, obs: [], w: isBig ? RW * 1.6 : RW, h: RH, ep: []
      };
      list.push({x: nx, y: ny});
    }
  }

  // Conectar puertas entre adyacentes
  for(const k in rooms){
    const r = rooms[k];
    for(const d of DIRS){
      const nk = `${r.x + d.dx},${r.y + d.dy}`;
      if(rooms[nk]) r.doors[d.k] = true;
    }
  }

  // Identificar callejones sin salida (dead ends)
  const deadEnds = Object.values(rooms).filter(r => Object.keys(r.doors).length === 1 && (r.x !== 0 || r.y !== 0));
  deadEnds.sort((a,b) => Math.hypot(b.x, b.y) - Math.hypot(a.x, a.y));

  // Jefe al final
  if(deadEnds.length > 0) deadEnds[0].type = 'boss';
  else {
    const far = Object.values(rooms).filter(r => r.x !== 0 || r.y !== 0).sort((a,b) => Math.hypot(b.x,b.y) - Math.hypot(a.x,a.y))[0];
    if(far) far.type = 'boss';
  }

  // Sala del Tesoro con Pedestal de arma o reliquia
  if(deadEnds.length > 1){ deadEnds[1].type = 'treasure'; deadEnds[1].cleared = true; }
  else {
    const f = Object.values(rooms).find(r => r.type === 'combat');
    if(f){ f.type = 'treasure'; f.cleared = true; }
  }

  // Tienda / Altar
  if(deadEnds.length > 2){ deadEnds[2].type = 'shop'; deadEnds[2].cleared = true; }

  // Salas especiales extra: fuente curativa y desafío
  const combatRooms = Object.values(rooms).filter(r => r.type === 'combat' && (r.x !== 0 || r.y !== 0));
  const takeRoom = () => combatRooms.length ? combatRooms.splice(Math.floor(pr() * combatRooms.length), 1)[0] : null;
  if(pr() < .75){ const f_ = takeRoom(); if(f_){ f_.type = 'fountain'; f_.cleared = true; } }
  if(floor >= 2 && pr() < .7){ const c_ = takeRoom(); if(c_) c_.type = 'challenge'; }

  // Generar obstáculos y patrones de interior para cada sala
  for(const k in rooms) setupRoomInterior(rooms[k], th, floor, pr);

  dung = {
    active: true, floor, seed: sd, rooms, curRoomKey: '0,0',
    curRoom: rooms['0,0'], keys: 1, passives: dung.passives || [],
    pedestals: [], trapdoor: null, transT: 0, transDir: null, floorTheme: th
  };
  enterRoom('0,0', true);
}

function decorate(r, th, pr, fl){
  r.dec = [];
  const cx = r.w >> 1, bad = x => r.doors.n && x >= cx - 2 && x <= cx + 1;
  const nT = 2 + Math.floor(pr() * 3);
  for(let i = 0; i < nT; i++){ const x = 2 + Math.floor(pr() * (r.w - 4)); if(!bad(x) && !r.dec.some(d => d.x === x)) r.dec.push({ t: 'torch', x, y: 0 }); }
  const cols = ['#7f1d1d', '#1e3a8a', '#581c87', '#14532d'];
  for(let i = 0, n = Math.floor(pr() * 3); i < n; i++){
    const x = 2 + Math.floor(pr() * (r.w - 4));
    if(!bad(x) && !r.dec.some(d => d.x === x && d.y === 0)) r.dec.push({ t: 'banner', x, y: 0, c: cols[Math.floor(pr() * cols.length)] });
  }
  const kinds = [['bone', 'skull', 'crack', 'blood', 'bone'], ['moss', 'moss', 'crack', 'skull', 'blood'], ['lava', 'lava', 'crack', 'skull', 'bone'], ['rune', 'rune', 'crack', 'skull', 'bone'], ['rune', 'crack', 'crack', 'skull', 'blood']][(fl - 1) % 5];
  const n = 7 + Math.floor(pr() * 9);
  for(let i = 0; i < n; i++) r.dec.push({ t: kinds[Math.floor(pr() * kinds.length)], x: 2 + Math.floor(pr() * (r.w - 4)), y: 2 + Math.floor(pr() * (r.h - 4)) });
}

function setupRoomInterior(r, th, fl, pr){
  r.obs = []; r.ep = []; r.eps = []; r.props = []; r.spk = []; r.wave = 0; r.waves = 1;
  decorate(r, th, pr, fl);
  const cx = r.w >> 1, cy = r.h >> 1;
  if(r.type === 'start'){ r.rug = true; return; }
  if(r.type === 'treasure'){
    r.item = pr() < 0.5 ? { t: 'relic', i: Math.floor(pr() * RELICS.length) } : { t: 'wp', i: 1 + Math.floor(pr() * (WP.length - 1)) };
    r.rug = true;
    if(pr() < .4){
      for(const [dx, dy] of [[-2,-1],[-2,0],[-2,1],[2,-1],[2,0],[2,1],[-1,-2],[0,-2],[1,-2],[-1,2],[0,2],[1,2]]) r.spk.push({ x: cx + dx, y: cy + dy });
      r.trap = true;
    }
    return;
  }
  if(r.type === 'shop'){
    r.shopItems = [
      { t: 'heart', pr: 15, n: 'Corazón' },
      { t: 'armor', pr: 25, n: 'Armadura' },
      { t: 'relic', pr: 45, i: Math.floor(pr() * RELICS.length), n: 'Reliquia' }
    ];
    r.rug = true;
    return;
  }
  if(r.type === 'fountain') return;

  // ---- zona reservada junto a las puertas + utilidades de colocación
  const near = (x, y) => {
    const c = (dx, dy) => Math.abs(x - dx) <= 2 && Math.abs(y - dy) <= 2;
    return (r.doors.n && (c(cx, 1) || c(cx - 1, 1))) || (r.doors.s && (c(cx, r.h - 2) || c(cx - 1, r.h - 2))) || (r.doors.w && c(1, cy)) || (r.doors.e && c(r.w - 2, cy));
  };
  const occ = {};
  const addO = (x, y) => {
    x |= 0; y |= 0;
    if(x < 2 || y < 2 || x > r.w - 3 || y > r.h - 3 || near(x, y) || occ[x + ',' + y]) return false;
    occ[x + ',' + y] = 1; r.obs.push({ x, y }); return true;
  };
  const cell = () => {
    for(let i = 0; i < 50; i++){
      const x = 3 + Math.floor(pr() * (r.w - 6)), y = 3 + Math.floor(pr() * (r.h - 6));
      if(!occ[x + ',' + y] && !near(x, y)) return { x, y };
    }
    return null;
  };
  // ---- 15 diseños de sala distintos
  const L = [
    () => { [[4, 3], [r.w - 5, 3], [4, r.h - 4], [r.w - 5, r.h - 4]].forEach(a => addO(a[0], a[1])); },
    () => { [[cx - 1, cy - 1], [cx, cy - 1], [cx - 1, cy + 1], [cx, cy + 1]].forEach(a => addO(a[0], a[1])); },
    () => { for(let i = 0; i < 2; i++){ addO(3 + i, 2); addO(r.w - 5 + i, 2); addO(3 + i, r.h - 3); addO(r.w - 5 + i, r.h - 3); } },
    () => { for(let x = cx - 4; x <= cx + 3; x++) for(const y of [cy - 2, cy + 2]) if(x !== cx - 1 && x !== cx) addO(x, y); for(const x of [cx - 4, cx + 3]) for(let y = cy - 1; y <= cy + 1; y++) if(y !== cy) addO(x, y); },
    () => { for(const i of [3, 4, 5]){ addO(cx - i, cy); addO(cx + i - 1, cy); } for(const i of [2, 3]){ addO(cx - 1, cy - i); addO(cx, cy - i); addO(cx - 1, cy + i); addO(cx, cy + i); } },
    () => { for(let x = 4; x <= r.w - 5; x++) if(x < cx - 2 || x > cx + 1){ addO(x, cy - 2); addO(x, cy + 2); } },
    () => { for(let y = 2; y <= r.h - 3; y++) if(y < cy - 1 || y > cy + 1){ addO(cx - 5, y); addO(cx + 4, y); } },
    () => { for(let x = 3; x <= r.w - 4; x += 4) for(let y = 2; y <= r.h - 3; y += 3) addO(x, y); },
    () => { for(const [sx, sy] of [[3, 2], [r.w - 4, 2], [3, r.h - 3], [r.w - 4, r.h - 3]]){ addO(sx, sy); addO(sx + (sx < cx ? 1 : -1), sy); addO(sx, sy + (sy < cy ? 1 : -1)); } },
    () => { for(let x = cx - 4; x <= cx + 3; x++) addO(x, cy + 2); for(const x of [cx - 4, cx + 3]) for(let y = cy; y <= cy + 1; y++) addO(x, y); },
    () => { [[cx - 3, cy - 2], [cx + 2, cy - 2], [cx - 3, cy + 2], [cx + 2, cy + 2], [cx - 1, cy], [cx, cy]].forEach(a => addO(a[0], a[1])); },
    () => { for(let x = 5; x <= r.w - 6; x++) if(x < cx - 1 || x > cx){ addO(x, 2); addO(x, r.h - 3); } },
    () => { for(let i = 0, n = 8 + Math.floor(pr() * 5); i < n; i++){ const c = cell(); if(c) addO(c.x, c.y); } },
    () => {},
    () => { for(const x of [cx - 6, cx + 5]) for(const y of [3, 5, 7]) addO(x, y); }
  ];
  const pat = r.type === 'boss' ? [0, 3, 2, 9, 0][fl % 5] : Math.floor(pr() * L.length);
  L[pat]();
  // ---- pinchos, barriles explosivos y cajas
  const addSp = n => { for(let i = 0; i < n; i++){ const c = cell(); if(c){ occ[c.x + ',' + c.y] = 2; r.spk.push(c); } } };
  if(r.type !== 'boss' && (pat === 13 || pr() < .4)) addSp(pat === 13 ? 8 + Math.floor(pr() * 4) : 3 + Math.floor(pr() * 5));
  const nBar = pr() < .55 ? 1 + Math.floor(pr() * 3) : 0, nCr = pr() < .65 ? 2 + Math.floor(pr() * 4) : 0;
  for(let i = 0; i < nBar; i++){ const c = cell(); if(c){ occ[c.x + ',' + c.y] = 3; r.props.push({ x: c.x, y: c.y, t: 'barrel', hp: 2 }); } }
  for(let i = 0; i < nCr; i++){ const c = cell(); if(c){ occ[c.x + ',' + c.y] = 3; r.props.push({ x: c.x, y: c.y, t: 'crate', hp: 2 }); } }
  // ---- oleadas de enemigos
  const spawnCell = () => {
    for(let i = 0; i < 60; i++){
      const x = 3 + Math.floor(pr() * (r.w - 6)), y = 3 + Math.floor(pr() * (r.h - 6));
      if(!occ[x + ',' + y] && !near(x, y)) return { x, y };
    }
    return { x: cx, y: cy };
  };
  if(r.type === 'boss'){
    r.eps = [[{ k: D_BOSSES[(fl - 1) % D_BOSSES.length], rx: r.w / 2, ry: r.h / 2, isBoss: true }]];
    r.waves = 1;
  } else {
    const pool = dPool(fl + (r.type === 'challenge' ? 1 : 0));
    const baseN = 4 + Math.min(9, Math.floor(fl * 1.5 + pr() * 3));
    r.waves = r.type === 'challenge' ? 3 : 1 + (fl >= 2 && pr() < .45 ? 1 : 0) + (fl >= 4 && pr() < .35 ? 1 : 0);
    for(let w = 0; w < r.waves; w++){
      const grp = [], n = baseN + (r.type === 'challenge' ? 2 : 0) - w;
      for(let i = 0; i < n; i++){ const c = spawnCell(); grp.push({ k: pool[Math.floor(pr() * pool.length)], rx: c.x + .5, ry: c.y + .5 }); }
      r.eps.push(grp);
    }
  }
  r.ep = r.eps[0] || [];
}

function dungTile(px, py){
  const r = dung.curRoom;
  if(!r) return 1;
  const tx = Math.floor(px / T), ty = Math.floor(py / T);
  // Bordes de la sala
  if(tx < 0 || ty < 0 || tx >= r.w || ty >= r.h) return 1;
  // Paredes perimetrales con hueco para puertas
  const isDoorH = (tx === Math.floor(r.w / 2) || tx === Math.floor(r.w / 2) - 1);
  const isDoorV = (ty === Math.floor(r.h / 2));

  if(ty === 0 && r.doors.n && isDoorH) return r.cleared ? 0 : 1;
  if(ty === r.h - 1 && r.doors.s && isDoorH) return r.cleared ? 0 : 1;
  if(tx === 0 && r.doors.w && isDoorV) return r.cleared ? 0 : 1;
  if(tx === r.w - 1 && r.doors.e && isDoorV) return r.cleared ? 0 : 1;

  if(tx === 0 || ty === 0 || tx >= r.w - 1 || ty >= r.h - 1) return 1;
  // Obstáculos y objetos destructibles
  if(r.obs && r.obs.some(o => o.x === tx && o.y === ty)) return 1;
  if(r.props && r.props.some(q => !q.dead && q.x === tx && q.y === ty)) return 1;
  return 0;
}

function freeSpot(r){
  for(let i = 0; i < 40; i++){
    const x = (3 + Math.random() * (r.w - 6)) * T, y = (3 + Math.random() * (r.h - 6)) * T;
    if(dungTile(x, y) === 0 && dungTile(x + 6, y) === 0 && dungTile(x - 6, y) === 0 && dungTile(x, y + 6) === 0 && dungTile(x, y - 6) === 0) return { x, y };
  }
  return { x: r.w * T / 2, y: r.h * T / 2 };
}
function spawnWave(r){
  const grp = r.eps[r.wave] || [];
  r.wave++;
  grp.forEach(e => { const en = mk(e.k, e.rx * T, e.ry * T); if(e.isBoss) boss = en; });
  if(r.type !== 'boss' && net.on){
    const extra = Math.min(3, Object.keys(net.rem).length), pool = dPool(dung.floor + (r.type === 'challenge' ? 1 : 0));
    for(let i = 0; i < extra * 2; i++){ const sp_ = freeSpot(r); mk(pool[rnd(0, pool.length - 1)], sp_.x, sp_.y); }
  }
  if(r.waves > 1 && r.wave > 1){
    banner('OLEADA ' + r.wave + '/' + r.waves);
    if(net.on) snd({ t: 'd_wave', k: dung.curRoomKey, n: r.wave, m: r.waves });
  }
}

function enterRoom(k, first){
  const r = dung.rooms[k];
  if(!r) return;
  V.coins += coins.length;   // las monedas sueltas se recogen al salir de la sala
  dung.curRoomKey = k;
  dung.curRoom = r;
  r.visited = true;
  enemies = []; bullets = []; eb = []; shw = []; coins = []; hearts = []; dung.pedestals = []; dung.trapdoor = null;
  boss = null;
  const lead = !net.on || net.host;

  if(!r.cleared){
    if(lead){ r.wave = 0; spawnWave(r); }
    banner(r.type === 'boss' ? '¡SALA DEL JEFE!' : r.type === 'challenge' ? '¡DESAFÍO: ' + r.waves + ' OLEADAS!' : 'SALA DE COMBATE');
    sDoorLock();
  } else if(r.type === 'fountain') banner('FUENTE CURATIVA');

  if(r.type === 'treasure' && r.item && !r.itemTaken){
    dung.pedestals.push({ id: 'it', x: (r.w / 2) * T, y: (r.h / 2) * T, item: r.item });
  }
  if(r.type === 'shop' && r.shopItems){
    r.shopItems.forEach((it, i) => {
      if(!it.bought) dung.pedestals.push({ id: 's' + i, x: (r.w / 2 + (i - 1) * 3) * T, y: (r.h / 2) * T, shop: it });
    });
  }
  if(r.type === 'boss' && r.cleared){
    dung.trapdoor = { x: (r.w / 2) * T, y: (r.h / 2) * T };
  }
}

function checkDungDoors(){
  const r = dung.curRoom;
  if(!r || !r.cleared || p.dead) return;
  const isMidX = Math.abs(p.x - (r.w / 2) * T) < 18;
  const isMidY = Math.abs(p.y - (r.h / 2) * T) < 18;

  let nextK = null, px = p.x, py = p.y, dir = null;
  if(r.doors.n && isMidX && p.y < 20){
    nextK = `${r.x},${r.y - 1}`;
    const nr = dung.rooms[nextK];
    if(nr){ px = (nr.w / 2) * T; py = (nr.h - 2) * T; dir = 'n'; }
  } else if(r.doors.s && isMidX && p.y > (r.h - 1) * T - 10){
    nextK = `${r.x},${r.y + 1}`;
    const nr = dung.rooms[nextK];
    if(nr){ px = (nr.w / 2) * T; py = 2 * T; dir = 's'; }
  } else if(r.doors.w && isMidY && p.x < 20){
    nextK = `${r.x - 1},${r.y}`;
    const nr = dung.rooms[nextK];
    if(nr){ px = (nr.w - 2) * T; py = (nr.h / 2) * T; dir = 'w'; }
  } else if(r.doors.e && isMidY && p.x > (r.w - 1) * T - 10){
    nextK = `${r.x + 1},${r.y}`;
    const nr = dung.rooms[nextK];
    if(nr){ px = 2 * T; py = (nr.h / 2) * T; dir = 'e'; }
  }

  if(nextK && dung.rooms[nextK]){
    if(net.on) snd({ t: 'd_room', k: nextK, px, py, dir });   // todos los jugadores pasan a la misma sala
    dung.transT = 0.22;
    p.x = px; p.y = py;
    enterRoom(nextK);
    sDoorOpen();
  }
}

function checkDungClear(){
  const r = dung.curRoom;
  if(!r || r.cleared) return;
  if(enemies.length > 0) return;                         // la puerta no abre hasta matar a todos
  if(r.wave < r.waves){ spawnWave(r); return; }          // siguiente oleada
  r.cleared = true;
  const rel = (r.type === 'boss' || r.type === 'challenge') ? rnd(0, RELICS.length - 1) : -1;
  const hd = Math.random() < .35 ? 1 : 0, cn = rnd(4, 9);
  if(net.on) snd({ t: 'd_clear', k: dung.curRoomKey, rel, hd, cn });
  roomCleared(r, rel, hd, cn);
}
function roomCleared(r, rel, hd, cn){
  r.cleared = true;
  sDoorUnlock();
  banner('¡HABITACIÓN DESPEJADA!');
  coinFx(r.w * T / 2, r.h * T / 2, cn);
  if(hd) hearts.push({ x: r.w * T / 2 + 18, y: r.h * T / 2 });
  if(r.type === 'boss'){
    dung.trapdoor = { x: (r.w / 2) * T, y: (r.h / 2) * T };
    V.bestDung = Math.max(V.bestDung || 1, dung.floor + 1);
    save();
  }
  if(r.type === 'boss' || r.type === 'challenge'){
    dung.pedestals.push({ id: 'rw', x: (r.w / 2) * T, y: (r.h / 2 - 2) * T, item: { t: 'relic', i: rel >= 0 ? rel : rnd(0, RELICS.length - 1) } });
    sFan();
  }
}

// ---- pinchos, cajas y barriles
const spkState = s_ => { const ph = (t + ((s_.x * 7 + s_.y * 13) % 10) * .26) % 2.6; return ph < 1.4 ? 0 : ph < 1.75 ? 1 : 2; };
function propAt(x, y){
  const r = dung.curRoom; if(!r || !r.props) return null;
  const tx = Math.floor(x / T), ty = Math.floor(y / T);
  return r.props.find(q => !q.dead && q.x === tx && q.y === ty) || null;
}
function hitPropNet(q, d){
  if(net.on && !net.host) snd({ t: 'd_ph', k: dung.curRoomKey, i: dung.curRoom.props.indexOf(q), d, o: myId() });
  else damageProp(q, d, myId());
}
function damageProp(q, d, own){
  q.hp -= d; q.fl = .12;
  if(q.hp <= 0) breakProp(q, own);
}
function breakProp(q, own){
  if(q.dead) return;
  q.dead = true;
  const i = dung.curRoom.props.indexOf(q);
  if(net.on) snd({ t: 'd_pd', k: dung.curRoomKey, i, o: own });
  propFx(q, true, own);
}
function propFx(q, lead, own){
  const cx_ = q.x * T + 8, cy_ = q.y * T + 8;
  q.dead = true;
  if(q.t === 'barrel'){
    shw.push({ x: cx_, y: cy_, r: 2, m: 44, l: .6 });
    burst(cx_, cy_, '#ff9d3d', 16); sKill();
    if(lead){
      for(const e of enemies) if(!e.dead && Math.hypot(e.x - cx_, e.y - cy_) < 48) dmg(e, 10, own);
      for(const o of dung.curRoom.props) if(!o.dead && o.t === 'barrel' && Math.hypot(o.x * T + 8 - cx_, o.y * T + 8 - cy_) < 40) breakProp(o, own);
    }
  } else {
    burst(cx_, cy_, '#a16207', 8);
    coinFx(cx_, cy_, 1 + (q.x + q.y) % 3);
    if((q.x * 7 + q.y * 3) % 5 === 0) hearts.push({ x: cx_, y: cy_ });
  }
}
function drawProp(q){

    g.fillStyle = f ? '#fff' : '#9a3412'; g.fillRect(X + 4, Y + 2, 3, 12);
    g.fillStyle = '#dc2626'; g.fillRect(X + 3, Y + 4, 10, 2); g.fillRect(X + 3, Y + 10, 10, 2);
    g.fillStyle = '#fde047'; g.fillRect(X + 7, Y + 6, 2, 3);
  } else {
    g.fillStyle = f ? '#fff' : '#a16207'; g.fillRect(X + 2, Y + 3, 12, 12);
    g.fillStyle = '#ca8a04'; g.fillRect(X + 3, Y + 4, 10, 2); g.fillRect(X + 3, Y + 11, 10, 2);
    g.fillStyle = '#713f12'; g.fillRect(X + 2, Y + 8, 12, 1); g.fillRect(X + 7, Y + 3, 1, 12);

}
function drawGrave(x, y){

}

function checkPedestals(){
  for(let i = dung.pedestals.length - 1; i >= 0; i--){
    const ped = dung.pedestals[i];
    if(p.dead || Math.hypot(p.x - ped.x, p.y - ped.y) >= 14) continue;
    if(ped.shop){
      if(V.coins >= ped.shop.pr){
        V.coins -= ped.shop.pr;
        ped.shop.bought = true;
        sCoin();
        if(ped.shop.t === 'heart'){ p.hp = Math.min(p.maxHp || 5, p.hp + 2); banner('+2 CORAZONES'); }
        else if(ped.shop.t === 'armor'){ p.ar = (p.ar || 0) + 1; banner('+1 ARMADURA'); }
        else if(ped.shop.t === 'relic'){ obtainRelic(ped.shop.i); }
        if(net.on) snd({ t: 'd_take', k: dung.curRoomKey, id: ped.id });
        dung.pedestals.splice(i, 1);
      } else if(t - (net.poorT || -9) > 1.5){
        net.poorT = t; banner('¡MONEDAS INSUFICIENTES!');
      }
    } else if(ped.item){
      if(ped.item.t === 'relic'){
        obtainRelic(ped.item.i);
      } else if(ped.item.t === 'wp'){
        if(!V.owned.includes(ped.item.i)) V.owned.push(ped.item.i);
        V.eq = ped.item.i;
        banner('¡' + WP[V.eq].n.toUpperCase() + ' EQUIPADA!');
        sFan();
      }
      dung.curRoom.itemTaken = true;
      if(net.on) snd({ t: 'd_take', k: dung.curRoomKey, id: ped.id });
      dung.pedestals.splice(i, 1);
    }
  }

  // Trampilla al siguiente piso (la maneja el anfitrión)
  if(dung.trapdoor && !p.dead && Math.hypot(p.x - dung.trapdoor.x, p.y - dung.trapdoor.y) < 14){
    if(net.on && !net.host){
      if(t - (net.ndT || -9) > 1){ net.ndT = t; snd({ t: 'd_next' }); }
    } else if(!dung.descending){
      dung.descending = true; descend();
    }
  }
}

let AC, mg, sg;
function initAudio(){
  if(AC) return;
  try{
    AC = new (window.AudioContext || window.webkitAudioContext)();
    mg = AC.createGain(); sg = AC.createGain();
    const cp = AC.createDynamicsCompressor();
    cp.threshold.value = -20; cp.ratio.value = 4;
    mg.connect(cp); cp.connect(AC.destination);
    sg.connect(AC.destination);
    vol(); AC.resume && AC.resume(); music();
  }catch(e){ AC = null; }
}
function vol(){ if(AC){ mg.gain.value = S.mus * .2; sg.gain.value = S.sfx * .5; } }
function tone(ty, f, f2, d, v, dest){
  if(!AC) return;
  const n = AC.currentTime, o = AC.createOscillator(), q = AC.createGain();
  o.type = ty;
  o.frequency.setValueAtTime(f, n);
  o.frequency.exponentialRampToValueAtTime(f2, n + d);
  q.gain.setValueAtTime(v, n);
  q.gain.exponentialRampToValueAtTime(.001, n + d);
  o.connect(q); q.connect(dest);
  o.start(n); o.stop(n + d);
}
const sShot = () => {
  const f = [320, 420, 200, 520, 680, 260, 480, 550][V.eq] || 400;
  tone(V.eq === 4 || V.eq === 5 ? 'sawtooth' : 'square', f, f * .35, .07, .2, sg);

const sKill = () => tone('square', 300, 650, .1, .18, sg);
const sCoin = () => tone('square', 880, 1320, .07, .12, sg);
const sHurt = () => tone('sawtooth', 150, 50, .2, .25, sg);
const sDoorLock = () => tone('square', 180, 90, .15, .25, sg);
const sDoorUnlock = () => tone('square', 440, 880, .12, .2, sg);
const sDoorOpen = () => tone('sawtooth', 120, 280, .18, .2, sg);

const MV = () => S.mus * .2, mf = n => 440 * Math.pow(2, (n - 69) / 12), CT = { m: [0,3,7], M: [0,4,7], '7': [0,4,7,10] }, NO = { c:0, d:2, e:4, f:5, g:7, a:9, b:11 };
function nn(s){ let i = 1, n = NO[s[0]]; if(s[i] === '#'){ n++; i++; } else if(s[i] === 'b'){ n--; i++; } return n + 12 * (+s.slice(i) + 1); }
function parseBar(str){ const ev = []; let st = 0; for(const tk of str.split(' ')){ const q = tk.split(':'), l = +q[1]; if(q[0] !== 'r') ev[st] = { n: nn(q[0]), l }; st += l; } return ev; }
const MB = (r, ty, m, sec, tr) => ({ r, ty, ev: parseBar(m), sec, tr: tr || 0 });

const BAT = [
  MB(38,'m',"r:2 a4:1 d5:1 f5:2 a5:2 g5:1 f5:1 e5:2 d5:2 f5:2",'A'),
  MB(34,'M',"d5:2 f5:2 bb5:4 a5:2 g5:2 f5:4",'A'),

  MB(38,'m',"r:2 a4:1 d5:1 f5:2 a5:2 g5:1 f5:1 e5:2 d5:2 e5:2",'A'),
  MB(43,'m',"d5:2 g5:2 bb5:4 a5:2 g5:2 d5:4",'A'),
  MB(33,'7',"e5:2 g5:2 a5:2 c#6:2 e6:4 d6:2 c#6:2",'A'),
  MB(33,'7',"a5:4 g5:2 e5:2 c#5:2 e5:2 a4:4",'A')
];
const BOA = [
  MB(38,'m',"d5:3 d5:1 r:2 d5:1 e5:1 f5:3 e5:1 d5:2 c5:2",'A'),
  MB(34,'M',"bb4:3 bb4:1 r:2 bb4:1 c5:1 d5:3 c5:1 bb4:2 a4:2",'A'),

];

const MEN = [
  MB(38,'m',"a4:4 d5:4 f5:6 e5:2",'M'),
  MB(34,'M',"d5:4 bb4:4 d5:8",'M'),

const PW = {}; let NBF = null;
const pulse = d => {
  if(!PW[d]){
    const n = 32, re = new Float32Array(n), im = new Float32Array(n);
    for(let k = 1; k < n; k++) re[k] = Math.sin(Math.PI * k * d) * 2 / (k * Math.PI);
    PW[d] = AC.createPeriodicWave(re, im);
  }
  return PW[d];
};
const nbuf = () => NBF || (NBF = (() => {
  const b = AC.createBuffer(1, AC.sampleRate, AC.sampleRate), d = b.getChannelData(0);
  for(let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  return b;
})());

function voice(dest, w, f, dur, v, o){
  const os = AC.createOscillator(), gn = AC.createGain();
  if(o.t === 'pulse') os.setPeriodicWave(pulse(o.d || .25)); else os.type = o.t;
  os.frequency.value = f;
  if(o.det) os.detune.value = o.det;
  if(o.lp){
    const fl = AC.createBiquadFilter(); fl.type = 'lowpass'; fl.frequency.value = o.lp;
    os.connect(fl); fl.connect(gn);
  } else os.connect(gn);
  const a = o.a || .004, r = o.r || .05;
  gn.gain.setValueAtTime(0, w);
  gn.gain.linearRampToValueAtTime(v, w + a);
  gn.gain.linearRampToValueAtTime(v * (o.s === undefined ? 1 : o.s), w + Math.max(a + .001, dur));
  gn.gain.linearRampToValueAtTime(0, w + dur + r);
  gn.connect(dest); os.start(w); os.stop(w + dur + r + .02);
}

function noiseHit(d, w, v, dur, type, f, f2){
  const s_ = AC.createBufferSource(), fl = AC.createBiquadFilter(), gn = AC.createGain();
  s_.buffer = nbuf(); s_.loop = true; fl.type = type; fl.frequency.setValueAtTime(f, w);
  if(f2) fl.frequency.exponentialRampToValueAtTime(f2, w + dur);
  gn.gain.setValueAtTime(v, w); gn.gain.exponentialRampToValueAtTime(.001, w + dur);
  s_.connect(fl); fl.connect(gn); gn.connect(d); s_.start(w, Math.random() * .5); s_.stop(w + dur + .02);
}
const kick = (d, w, v) => {
  const o = AC.createOscillator(), gn = AC.createGain(); o.type = 'sine';
  o.frequency.setValueAtTime(150, w); o.frequency.exponentialRampToValueAtTime(40, w + .12);
  gn.gain.setValueAtTime(v, w); gn.gain.exponentialRampToValueAtTime(.001, w + .2);
  o.connect(gn); gn.connect(d); o.start(w); o.stop(w + .22);
};
const snare = (d, w, v) => { noiseHit(d, w, v, .13, 'bandpass', 1900); voice(d, w, 190, .08, v * .5, { t: 'triangle', s: .2, r: .02 }); };
const hat = (d, w, v) => noiseHit(d, w, v, .04, 'highpass', 7500);
const crash = (d, w, v) => noiseHit(d, w, v, 1.3, 'highpass', 3500);

function drums(T, bi, ps, w, sec){
  const d = T.g, k = T.k;
  if(k === 'battle'){
    if(ps === 0 || ps === 8) kick(d, w, .85);
    if(ps === 4 || ps === 12) snare(d, w, .34);
    if(ps % 2 === 0) hat(d, w, .07);
    if(ps === 0 && bi === 0) crash(d, w, .22);
  } else {
    if(ps === 0 || ps === 8) kick(d, w, .9);
    if(ps === 4 || ps === 12) snare(d, w, .36);
    hat(d, w, ps % 2 ? .05 : .1);
  }
}

function bar16(T, step, w){
  const s = T.s, d = T.g, bi = Math.floor(step / 16) % T.bars.length, ps = step % 16, bar = T.bars[bi], tr = bar.tr, r = bar.r + tr, tn = CT[bar.ty], sec = bar.sec, k = T.k, e = bar.ev[ps];
  if(k === 'menu'){
    if(e) voice(d, w, mf(e.n), e.l * s, .22, { t: 'pulse', d: .5, a: .02, r: .12, s: .7 });
    if(ps === 0 || ps === 8) voice(d, w, mf(r + (ps ? 7 : 0)), s * 7.5, .4, { t: 'triangle', a: .02, r: .2 });
    return;
  }
  const boss = k === 'boss';
  if(e) voice(d, w, mf(e.n + tr), e.l * s * .96, boss ? .34 : .31, { t: 'pulse', d: .25, a: .004, r: .05, s: .75 });
  if(ps % 2 === 0) voice(d, w, mf(r + [0, 12, 0, 12][ps / 2 % 4]), s * 1.9, .45, { t: 'triangle', r: .03, s: .7 });
  drums(T, bi, ps, w, sec);
}

const TR = {}; let bossNear = false, lastBossId = -1;
const wantTrack = () => state === 'play' ? (bossNear ? 'boss' : 'battle') : 'menu';

function fadeTo(T, v, dd){
  const n = AC.currentTime; T.g.gain.cancelScheduledValues(n);
  T.g.gain.setValueAtTime(T.g.gain.value, n); T.g.gain.linearRampToValueAtTime(v, n + dd);
}
function music(){
  TR.battle = { k: 'battle', bars: BAT, s: 60 / 144 / 4, gv: .85 };
  TR.boss = { k: 'boss', bars: BOS, s: 60 / 168 / 4, gv: 1 };
  TR.menu = { k: 'menu', bars: MEN, s: 60 / 84 / 4, gv: .8 };
  for(const n in TR){
    const T = TR[n]; T.g = AC.createGain(); T.g.gain.value = 0; T.g.connect(mg);
    T.on = false; T.out = 0; T.step = 0; T.next = 0;
  }
  setInterval(() => {
    const now = AC.currentTime, want = wantTrack();
    for(const n in TR){
      const T = TR[n];
      if(n === want){
        if(!T.on){ T.on = true; T.out = 0; T.step = 0; T.next = now + .06; fadeTo(T, T.gv, 1); }
        else if(T.out){ T.out = 0; fadeTo(T, T.gv, .6); }
      } else if(T.on && !T.out){ fadeTo(T, 0, 1.2); T.out = now + 1.3; }
      if(T.on){
        if(T.next < now - .2) T.next = now + .05;
        while(T.next < now + .4){ bar16(T, T.step, T.next); T.step++; T.next += T.s; }
        if(T.out && now > T.out){ T.on = false; T.out = 0; }
      }
    }
  }, 80);
}

  }
}
const num = (x, y, s, col) => nums.push({ x, y, s, c: col, l: .7 });
function coinFx(x, y, n){
  const hasGreed = dung.passives && dung.passives.includes(8);
  if(hasGreed) n *= 2;
  for(let i = 0; i < n; i++) coins.push({ x, y, vx: rnd(-45, 45), vy: rnd(-45, 45) });
}

function hurt(){

  else p.hp--;

  burst(p.x, p.y - 6, '#e43b44', 8);

  if(p.hp <= 0){

    }
    else {
      state = 'over';
      best = Math.max(best, kills);

function hit(e, d){

    e.hp = Math.max(.1, e.hp - d);
    e.fl = .12; e.hb = 1.6;

function dmg(e, d, own){
  const q = EN[e.k];
  e.hp -= d; e.fl = .12; e.hb = 1.6;
  num(e.x, e.y - q.cy - 8, '-' + d, '#fff');
  sHit();
  burst(e.x, e.y - q.cy, '#ff5a5a', 3);

  // Reliquias de vampiro / congelación
  if(dung.passives && dung.passives.includes(1)){
    if(Math.random() < 0.15 && p.hp < (p.maxHp || 5)){
      p.hp++; num(p.x, p.y - 14, '+1 HP', '#ff4d6d');
    }
  }

  if(e.hp <= 0 && !e.dead){
    e.dead = true; kills++;
    if(own === myId()) missionEvent('kill', e.k);
    if(net.on && mode === 'surv') net.sc[own] = (net.sc[own] || 0) + 1;
    sKill(); burst(e.x, e.y - q.cy, '#ffffff', 10);
    const n = rnd(q.c[0], q.c[1]) * (e.el ? 2 : 1);
    if(q.boss){ boss = null; sFan(); if(mode === 'camp') bd = true; }
    if(own === myId()) coinFx(e.x, e.y, n);
    else snd({ t: 'c', to: own, n, k: e.k, x: e.x, y: e.y });
    if(Math.random() < (e.el ? .35 : .14)){ hearts.push({ x: e.x, y: e.y }); if(net.on) snd({ t: 'hr', x: e.x, y: e.y }); }
  }
}

function shoot(){
  const w = WP[V.eq];
  let cd = w.cd;
  if(dung.passives && dung.passives.includes(7)) cd *= 0.65; // Batería Arcana
  p.cd = cd; p.kick = 2;

  let extra = 0;
  if(dung.passives && dung.passives.includes(10)) extra = 2; // Corona Tríada
  const pellets = w.pel + extra;
  const dmgAdd = (dung.passives && dung.passives.includes(3)) ? 1 : 0; // Ojo de Halcón
  const pierce = (dung.passives && dung.passives.includes(5)) || w.prc;

  for(let i = 0; i < pellets; i++){
    const spread = pellets > 1 ? (i - (pellets - 1) / 2) * 0.16 : (Math.random() - .5) * w.sp;
    const a = p.ang + spread;
    const vx = Math.cos(a) * w.s, vy = Math.sin(a) * w.s;
    const x = p.x + Math.cos(p.ang) * 9, y = p.y - 6 + Math.sin(p.ang) * 9;
    const l = w.pel > 1 ? .38 : 1.1;
    bullets.push({ x, y, vx, vy, l, d: w.d + dmgAdd, col: w.col, pierce });
    snd({ t: 's', x, y, vx, vy, l, col: w.col });
  }
  burst(p.x + Math.cos(p.ang) * 10, p.y - 6 + Math.sin(p.ang) * 10, w.col, 2);
  sShot();
}

function targets(){
  const a = [];
  if(!p.dead) a.push(p);
  for(const id in net.rem){ const r = net.rem[id]; if(!r.dd && r.tx !== undefined) a.push(r); }
  return a.length ? a : [p];
}

function shootE(x, y, a, sp, r, c){
  const b = { x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, l: 4, r, c };
  eb.push(b); snd({ t: 'eb', x, y, vx: b.vx, vy: b.vy, l: 4, r, c });
}
function shock(x, y, m){
  shw.push({ x, y, r: 2, m, l: .6 });
  snd({ t: 'sw', x, y, m });
}

function aiMove(e, dt, sm, tg){
  const d = EN[e.k], k = e.k, CDM = mode === 'dung' ? 1.3 : 1;
  if(e.born > 0){ e.born -= dt; return; }
  const dx = tg.x - e.x, dy = tg.y - e.y, dist = Math.hypot(dx, dy) || 1;
  const a = Math.atan2(dy, dx);
  const sp = d.sp * dt * sm * (e.el ? 1.15 : 1) * (1 + Math.sin(t * 6 + e.ph) * .4);

  const go = (an, s) => {
    if(d.nc){ e.x += Math.cos(an) * s; e.y += Math.sin(an) * s; }
    else move(e, Math.cos(an) * s, Math.sin(an) * s, d.r > 8 ? 6 : 4);
  };
  e.tm += dt;

  // Nuevos comportamientos (Esqueleto, Ojo, Kamikaze, Jefes)
  if(d.charger){
    // Embestida: se prepara (parpadea) y se lanza en línea recta
    if(e.st === 0){
      go(a, sp * .8); e.at -= dt * CDM;
      if(e.at <= 0 && dist < 170){ e.st = 1; e.tm = 0; e.tl = 1; e.ca = a; }
    } else if(e.st === 1){
      if(e.tm >= .7){ e.st = 2; e.tm = 0; e.tl = 0; }
    } else {
      go(e.ca, 185 * dt);
      if(e.tm >= .55){ e.st = 0; e.at = 2.2 + Math.random(); }
    }
  } else if(d.summoner){
    if(dist < 95) go(a + Math.PI, sp); else if(dist > 150) go(a, sp); else go(a + 1.57, sp * .5);
    e.at -= dt * CDM;
    if(e.at <= 0){
      const mine = enemies.filter(q => q.sm === e.id).length;
      if(mine < 4 && enemies.length < 22){
        for(let i = 0; i < 2; i++){ const q = mk(rnd(0, 1) ? 0 : 1, e.x + rnd(-14, 14), e.y + rnd(-10, 10), { noElite: true }); q.sm = e.id; }
        burst(e.x, e.y - 10, '#a3e635', 10);
      }
      e.at = 4.2;
    }
  } else if(d.sniper){
    if(dist < 120) go(a + Math.PI, sp * 1.1); else if(dist > 190) go(a, sp); else go(a + 1.57 * (Math.sin(e.ph) > 0 ? 1 : -1), sp * .5);
    e.at -= dt * CDM; e.tl = e.at < .6 ? 1 : 0;
    if(e.at <= 0){ shootE(e.x, e.y - 10, a, 150, 3, '#fde047'); e.at = 2.6; e.tl = 0; }
  } else if(d.spider){
    const bp = Math.sin(t * 3 + e.ph) > 0;
    go(a + Math.sin(t * 7 + e.ph) * .6, bp ? sp * 1.4 : sp * .25);
    e.at -= dt * CDM;
    if(e.at <= 0 && dist < 200){ for(let i = -1; i <= 1; i++) shootE(e.x, e.y - 6, a + i * .3, 80, 3, '#e2e8f0'); e.at = 3; }
  } else if(d.bomb){
    // Kamikaze corre hacia el jugador y explota
    go(a, sp * 1.5);
    if(dist < 18){ shock(e.x, e.y, 40); e.dead = true; if(tg === p) hurt(); }
  } else if(d.ranged){
    // Esqueleto tirador
    if(dist > 110) go(a, sp);
    else if(dist < 70) go(a + Math.PI, sp);
    e.at -= dt * CDM;
    if(e.at <= 0 && dist < 220){ shootE(e.x, e.y - 8, a, 100, 3, '#fff'); e.at = 2; }
  } else if(d.burst){
    // Ojo que dispara ráfagas triples
    go(a + Math.sin(t * 4) * .8, sp);
    e.at -= dt * CDM;
    if(e.at <= 0 && dist < 240){
      for(let i = -1; i <= 1; i++) shootE(e.x, e.y - 6, a + i * .25, 90, 3, '#c084fc');
      e.at = 2.4;
    }
  } else if(d.dBoss === 1){
    // Rey Ojo del Abismo: Anillos radiales y embestidas
    go(a, sp * .8);
    e.at -= dt * CDM;
    if(e.at <= 0){
      for(let i = 0; i < 10; i++) shootE(e.x, e.y - 8, i / 10 * 6.283 + t, 75, 3, '#c084fc');
      e.at = 2.2;
    }
  } else if(d.dBoss === 2){
    // Reina Ácida: Bombas de veneno y ondas sónicas
    go(a, sp * .7);
    e.at -= dt * CDM;
    if(e.at <= 0){
      for(let i = -2; i <= 2; i++) shootE(e.x, e.y - 8, a + i * .22, 85, 3, '#38d66b');
      shock(e.x, e.y, 50); e.at = 2.8;
    }
  } else if(d.dBoss >= 3){
    // Coloso de Magma / Caballero del Vacío / Soberano
    go(a, sp * (dist > 50 ? 1.1 : .6));
    e.at -= dt * CDM;
    if(e.at <= 0){
      for(let i = 0; i < 12; i++) shootE(e.x, e.y - 10, i / 12 * 6.283 + t * 2, 90, 3, '#ff4d6d');
      shock(e.x, e.y, 65); e.at = 2.3;
    }
  } else if(k === 10) go(a + Math.sin(t * 3 + e.ph) * .9, sp);
  else if(k === 11){
    if(dist > 95) go(a, sp);
    else if(dist < 65) go(a + Math.PI, sp);
    else go(a + 1.57, sp * .6);
    e.at -= dt * CDM;
    if(e.at <= 0 && dist < 200){ shootE(e.x, e.y - 8, a, 85, 3, '#ff7a00'); e.at = 2.2; }
  } else if(k === 5){
    if(e.st === 0){ go(a, sp); e.at -= dt * CDM; if(e.at <= 0 && dist < 230){ e.st = 1; e.tm = 0; e.tl = 1; e.jx = tg.x; e.jy = tg.y; } }
    else if(e.st === 1){ if(e.tm >= .6){ e.st = 2; e.tm = 0; e.tl = 0; e.sx = e.x; e.sy = e.y; } }
    else {
      const pr_ = Math.min(1, e.tm / .55);
      e.x = e.sx + (e.jx - e.sx) * pr_; e.y = e.sy + (e.jy - e.sy) * pr_;
      e.z = Math.sin(pr_ * Math.PI) * 34;
      if(pr_ >= 1){ e.z = 0; e.st = 0; e.at = 3.5; shock(e.x, e.y, 75); }
    }
  } else go(a, sp);
}

const board = () => {
  const Lb = [[net.id, V.av.name, net.sc[net.id] || 0]];
  for(const id in net.rem) Lb.push([+id, net.rem[id].name || '?', net.sc[id] || 0]);
  return Lb.sort((a, b) => b[2] - a[2]);
};

  burst(p.x, p.y - 6, '#7df9ff', 14);
  banner('¡REAPARECISTE!');
}

function goDoor(){

    return;
  }

}
function roundEnd(lb, w, o){

function showVote(){

  <div class=lb>${v.lb.map((r, i) => `<div class="lbr${r[0] === net.id ? ' me' : ''}"><span>${med[i] || (i + 1) + '.'}</span><span class=nm>${esc(r[1])}</span><b>${r[2]}</b></div>`).join('')}</div>
  <div class=r>VOTÁ EL PRÓXIMO MAPA · <b id=vtm class=vt>${Math.ceil(v.t)}</b>s</div>

  }).join('')}</div>`);
}
function updVote(){
  const v = vote; if(!v) return;
  const c_ = [0, 0, 0], n = 1 + Object.keys(net.rem).length;
  for(const k in v.votes) c_[v.votes[k]]++;
  v.o.forEach((m, i) => {
    const e = $('#vc' + i), b = $('#vb' + i);
    if(e) e.textContent = c_[i] + (c_[i] == 1 ? ' voto' : ' votos') + (v.mine === i ? ' ✔' : '');
    if(b) b.style.width = Math.round(c_[i] / n * 100) + '%';
  });
  const e = $('#vtm'); if(e) e.textContent = Math.max(0, Math.ceil(v.t));
}
function voteTick(dt){
  const v = vote; if(!v) return;
  v.t -= dt; v.bt -= dt;
  if(v.bt <= 0){ v.bt = .5; if(net.host) snd({ t: 'vs', v: v.votes, tm: v.t }); updVote(); }
  if(net.host){
    const n = 1 + Object.keys(net.rem).length;
    if(v.t <= 0 || Object.keys(v.votes).length >= n){
      const c_ = [0, 0, 0]; for(const k in v.votes) c_[v.votes[k]]++;
      const mx_ = Math.max(...c_), best_ = v.o.filter((m, i) => c_[i] === mx_), m_ = best_[rnd(0, best_.length - 1)];
      snd({ t: 'nm', m: m_ }); start('surv', 1, m_);
    }
  }
}

// ---------- CICLO DE ACTUALIZACIÓN (UPDATE) ----------
function update(dt){
  t += dt; bn.l -= dt;
  if(state === 'vote'){ voteTick(dt); return; }
  if(state !== 'play' || (paused && !net.on)) return;

  const host = isHost();
  let dx = (keys.d || keys.arrowright ? 1 : 0) - (keys.a || keys.arrowleft ? 1 : 0);
  let dy = (keys.s || keys.arrowdown ? 1 : 0) - (keys.w || keys.arrowup ? 1 : 0);
  if(stick){ dx = stick.x; dy = stick.y; }

  const l = Math.hypot(dx, dy);
  p.moving = l > .1 && !p.dead && !paused;
  let spMod = 75;
  if(dung.passives && dung.passives.includes(0)) spMod *= 1.3; // Alas de Hermes

  if(p.moving){
    const s = spMod * dt / Math.max(1, l);
    move(p, dx * s, dy * s, 4);
    p.walk += dt * 10;
  }

  p.ang = Math.atan2(my + camy - (p.y - 6), mx + camx - p.x);
  p.cd -= dt; p.inv -= dt; p.kick = Math.max(0, p.kick - dt * 40);

  if(p.dead > 1000){ if(mdown && !p.mm) spec++; p.mm = mdown; }
  if(p.dead > 0){
    p.dead -= dt;
    if(p.dead <= 0){ p.dead = 0; p.hp = 5; p.inv = 3; safeSpot(); }
  } else if(!paused && (mdown || keys[' ']) && p.cd <= 0) shoot();

  // Revivir compañeros caídos: mantené E cerca de su cuerpo
  if(net.on && (mode === 'dung' || mode === 'camp') && !p.dead){
    let tgt = null, bd2 = 26;
    for(const id in net.rem){
      const r = net.rem[id];
      if(r.dd && r.av && (mode !== 'dung' || r.rk === dung.curRoomKey)){
        const dd = Math.hypot(r.x - p.x, r.y - p.y);
        if(dd < bd2){ bd2 = dd; tgt = id; }
      }
    }
    if(tgt && keys.e){
      p.rv = (p.rvId === tgt ? (p.rv || 0) : 0) + dt; p.rvId = tgt;
      net.rvT = (net.rvT || 0) - dt;
      if(net.rvT <= 0){ net.rvT = .2; snd({ t: 'rvp', to: +tgt, v: Math.min(1, p.rv / 3) }); }
      if(p.rv >= 3){
        snd({ t: 'rv', to: +tgt }); net.rem[tgt].dd = 0;
        num(net.rem[tgt].x, net.rem[tgt].y - 20, '¡REVIVIDO!', '#7df9a0'); sFan(); p.rv = 0;
      }
    } else p.rv = 0;
    p.rvTgt = tgt;
  } else { p.rv = 0; p.rvTgt = null; }

  // Todos caídos: fin de la partida (mazmorras) o reinicio del nivel (campaña)
  if(net.on && net.host && p.dead > 1000 && Object.values(net.rem).every(r => r.dd)){
    if(mode === 'dung'){ snd({ t: 'd_over' }); dungOver(); return; }
    if(mode === 'camp'){ snd({ t: 'rs' }); start('camp', lvl); return; }
  }

  // Comprobaciones de Mazmorras
  if(mode === 'dung'){
    const rr = dung.curRoom;
    checkDungDoors();
    if(host) checkDungClear();
    checkPedestals();
    if(rr){
      for(const q of rr.props) if(q.fl > 0) q.fl -= dt;
      if(!p.dead && p.inv <= 0 && rr.spk.length){
        const tx_ = Math.floor(p.x / T), ty_ = Math.floor(p.y / T);
        for(const s_ of rr.spk) if(s_.x === tx_ && s_.y === ty_ && spkState(s_) === 2){ hurt(); break; }
      }
      if(rr.type === 'fountain' && !rr.used && !p.dead && Math.hypot(p.x - rr.w * T / 2, p.y - rr.h * T / 2) < 20){
        rr.used = true; p.hp = p.maxHp || 5; burst(p.x, p.y - 8, '#7dd3fc', 18); banner('¡VIDA RESTAURADA!'); sCoin();
      }
    }
  }

  if(net.on && mode === 'surv'){
    rt -= dt;
    if(net.host && rt <= 0){ endRound(); return; }
  }

  if(host && mode !== 'dung'){
    spawnT -= dt;
    if(spawnT <= 0){
      if(enemies.length < cap()) spawn(pick());
      spawnT = Math.max(.45, 1.7 - diff() * .09);
    }
    if(isBossLvl() && !boss && !bd) boss = spawn(bossFor()) || null;
    if(mode === 'surv' && !boss && kills >= nb){
      boss = spawn(BOSS[(nb / 30 - 1) % 4]) || null;
      if(boss) nb += 30;
    }
  }

  const sm = mode === 'dung' ? Math.min(1.7, 1.12 + dung.floor * .06) : Math.min(1.5, 1 + tier() * .03), tg0 = host ? targets() : null;
  for(const e of enemies){
    const d = EN[e.k]; e.fl -= dt; e.hb -= dt;
    if(!host){
      e.x += (e.tx - e.x) * Math.min(1, dt * 12);
      e.y += (e.tz - e.y) * Math.min(1, dt * 12);
    } else {
      let tg = tg0[0], bm = 1e9;
      for(const q of tg0){
        const dd = Math.hypot(q.x - e.x, q.y - e.y);
        if(dd < bm){ bm = dd; tg = q; }
      }
      aiMove(e, dt, sm, tg);
    }
    if(!p.dead && p.inv <= 0 && (e.z || 0) < 8 && !(e.born > 0) && Math.hypot(p.x - e.x, p.y - e.y) < d.r + 4) hurt();
  }

  // Balas del jugador
  for(const b of bullets){
    b.x += b.vx * dt; b.y += b.vy * dt; b.l -= dt;
    if(mode === 'dung' && !b.rm){
      const pq = propAt(b.x, b.y);
      if(pq){ b.l = 0; hitPropNet(pq, b.d || 1); burst(b.x, b.y, '#c9a227', 3); continue; }
    }
    if(tile(b.x, b.y) === 1){
      b.l = 0; burst(b.x, b.y, '#9ad17a', 3); continue;
    }
    for(const e of enemies){
      const d = EN[e.k];
      if(b.l > 0 && !e.dead && Math.hypot(b.x - e.x, b.y - (e.y - d.cy - (e.z || 0))) < d.r + 2){
        if(!b.pierce) b.l = 0;
        if(!b.rm) hit(e, b.d);
        burst(b.x, b.y, '#ff5a5a', 2);
        // Pólvora volátil (explosión)
        if(dung.passives && dung.passives.includes(4)) shock(b.x, b.y, 35);
      }
    }
  }
  bullets = bullets.filter(b => b.l > 0);
  enemies = enemies.filter(e => !e.dead);

  // Proyectiles enemigos
  for(const b of eb){
    b.x += b.vx * dt; b.y += b.vy * dt; b.l -= dt;
    if(tile(b.x, b.y) === 1) b.l = 0;
    if(b.l > 0 && !p.dead && p.inv <= 0 && Math.hypot(b.x - p.x, b.y - (p.y - 6)) < b.r + 3){
      b.l = 0; hurt();
    }
  }
  eb = eb.filter(b => b.l > 0);

  // Ondas de choque
  for(const w of shw){
    w.r += w.m / .6 * dt; w.l -= dt;
    if(!p.dead && p.inv <= 0 && Math.abs(Math.hypot(p.x - w.x, p.y - w.y) - w.r) < 7) hurt();
  }
  shw = shw.filter(w => w.l > 0);

  // Corazones
  hearts = hearts.filter(h => {
    if(Math.hypot(h.x - p.x, h.y - p.y) < 10){
      p.hp = Math.min(p.maxHp || 5, p.hp + 1);
      sCoin(); return false;
    }
    return true;
  });

  // Monedas
  for(const q of coins){
    q.x += q.vx * dt; q.y += q.vy * dt; q.vx *= .92; q.vy *= .92;
    const d = Math.hypot(p.x - q.x, p.y - 6 - q.y);
    if(d < (pet && pet.ty === 0 ? 95 : 45)){
      q.x += (p.x - q.x) * dt * 6; q.y += (p.y - 6 - q.y) * dt * 6;
    }
    if(d < 7){ q.got = 1; V.coins++; missionEvent('coin'); sCoin(); }
  }
  coins = coins.filter(q => !q.got);

  for(const q of parts){ q.x += q.vx * dt; q.y += q.vy * dt; q.l -= dt; }
  parts = parts.filter(q => q.l > 0);
  for(const n of nums){ n.y -= dt * 14; n.l -= dt; }
  nums = nums.filter(n => n.l > 0);

  missionTick(dt); petTick(dt); bossWatch();

  if(mode === 'camp' && !key && goalDone() && ms && ms.done){
    key = true; banner('¡TENÉS LA LLAVE! ANDÁ A LA PUERTA');
  }
  if(mode === 'camp' && key && door && !p.dead && Math.hypot(p.x - door.x, p.y - door.y) < 26){
    goDoor();
  }

  // Sincronización en red
  if(net.on){
    net.pt = (net.pt || 0) - dt;
    if(net.pt <= 0){
      net.pt = .066;
      snd({ t: 'p', x: p.x, y: p.y, a: p.ang, n: V.av.name, av: V.av, ar: V.arm, dd: p.dead > 1000 ? 1 : 0, rk: dung.curRoomKey });
    }
    if(net.host){
      net.et = (net.et || 0) - dt;
      if(net.et <= 0){
        net.et = .1; lsb = board();
        snd({
          t: 'e', k: kills, lv: lvl, mp: mapIdx, rt: Math.round(rt), bd: bd ? 1 : 0, ls: lsb, rk: mode === 'dung' ? dung.curRoomKey : 0,
          l: enemies.map(e => [e.id, e.k, Math.round(e.x), Math.round(e.y), e.hp, e.mx, e.el || 0, e.born > 0 ? 1 : 0])
        });
      }
    }
    for(const id in net.rem){
      const r = net.rem[id], k = Math.min(1, dt * 12), mv = Math.hypot(r.tx - r.x, r.ty - r.y) > .5;
      r.moving = mv; if(mv) r.walk += dt * 10;
      r.x += (r.tx - r.x) * k; r.y += (r.ty - r.y) * k;
      if(t - r.lt > 6) delete net.rem[id];
    }
  }
}

function onNet(d){
  if(d.t === 'p'){
    const r = net.rem[d.from] || (net.rem[d.from] = { x: d.x, y: d.y, walk: 0, moving: false, kick: 0 });
    r.tx = d.x; r.ty = d.y; r.ang = d.a; r.av = d.av; r.name = d.n; r.arm = d.ar; r.dd = d.dd; r.lt = t; r.rk = d.rk;
  }
  else if(d.t === 's') bullets.push({ x: d.x, y: d.y, vx: d.vx, vy: d.vy, l: d.l, d: 0, rm: 1, col: d.col });
  else if(d.t === 'eb') eb.push({ x: d.x, y: d.y, vx: d.vx, vy: d.vy, l: d.l, r: d.r, c: d.c });
  else if(d.t === 'sw') shw.push({ x: d.x, y: d.y, r: 2, m: d.m, l: .6 });
  else if(d.t === 'e' && !net.host){
    if(mode === 'dung' && d.rk && d.rk !== dung.curRoomKey) return;
    if(mode === 'camp' && d.lv && d.lv !== lvl){ if(d.lv > lvl){ V.coins += lvl * 10; save(); } start('camp', d.lv); return; }
    if(mode === 'surv' && d.mp != null && d.mp !== mapIdx){ start('surv', 1, d.mp); return; }
    kills = d.k; rt = d.rt; bd = !!d.bd; lsb = d.ls || [];
    const old = new Map(enemies.map(e => [e.id, e]));
    enemies = d.l.map(([id, k, x, y, hp, mx, el, bo]) => {
      let e = old.get(id);
      if(!e) e = { id, k, x, y, ph: Math.random() * 6, fl: 0, hb: 0 };
      else if(hp < e.hp){ e.fl = .12; e.hb = 1.6; }
      e.k = k; e.tx = x; e.tz = y; e.hp = hp; e.mx = mx; e.el = el || 0; e.born = bo ? 1 : 0; return e;
    });
    boss = enemies.find(e => EN[e.k].boss) || null;
  }
  else if(d.t === 'd_floor' && !net.host && mode === 'dung') newFloor(d.fl, d.sd || 1);
  else if(d.t === 'd_room' && mode === 'dung' && dung.rooms[d.k]){
    if(dung.curRoomKey !== d.k) enterRoom(d.k);
    const off = (((net.id || 0) % 3) - 1) * 10, vert = d.dir === 'n' || d.dir === 's';
    p.x = d.px + (vert ? off : 0); p.y = d.py + (vert ? 0 : off);
    dung.transT = .22; sDoorOpen();
  }
  else if(d.t === 'd_clear' && mode === 'dung'){
    const rr = dung.rooms[d.k];
    if(rr && !rr.cleared){ if(dung.curRoomKey === d.k) roomCleared(rr, d.rel, d.hd, d.cn); else rr.cleared = true; }
  }
  else if(d.t === 'd_wave' && mode === 'dung' && dung.curRoomKey === d.k){ dung.curRoom.wave = d.n; banner('OLEADA ' + d.n + '/' + d.m); }
  else if(d.t === 'd_take' && mode === 'dung'){
    if(dung.curRoomKey === d.k){
      const i = dung.pedestals.findIndex(q => q.id === d.id);
      if(i >= 0){ if(dung.pedestals[i].shop) dung.pedestals[i].shop.bought = true; dung.pedestals.splice(i, 1); }
    }
    const rr = dung.rooms[d.k];
    if(rr){
      if(d.id === 'it') rr.itemTaken = true;
      if(String(d.id).startsWith('s') && rr.shopItems && rr.shopItems[+String(d.id).slice(1)]) rr.shopItems[+String(d.id).slice(1)].bought = true;
    }
  }
  else if(d.t === 'd_ph' && net.host && mode === 'dung' && dung.curRoomKey === d.k){
    const q = dung.curRoom.props[d.i]; if(q && !q.dead) damageProp(q, d.d, d.from);
  }
  else if(d.t === 'd_pd' && mode === 'dung' && dung.curRoomKey === d.k){
    const q = dung.curRoom.props[d.i]; if(q && !q.dead) propFx(q, false, d.o);
  }
  else if(d.t === 'd_next' && net.host && mode === 'dung'){ if(!dung.descending){ dung.descending = true; descend(); } }
  else if(d.t === 'd_win' && mode === 'dung') winDung();
  else if(d.t === 'd_over' && mode === 'dung') dungOver();
  else if(d.t === 'rs' && mode === 'camp') start('camp', lvl);
  else if(d.t === 'hr') hearts.push({ x: d.x, y: d.y });
  else if(d.t === 'rv' && p.dead > 1000){
    p.dead = 0; p.hp = Math.max(2, Math.ceil((p.maxHp || 5) / 2)); p.inv = 3; p.rev = 0;

  }
  else if(d.t === 'rvp'){ p.rev = d.v; p.revT = t; }
  else if(d.t === 'w_hi'){
    net.wl = net.wl || {}; net.wl[d.from] = { n: d.n, av: d.av, h: d.h };
    if(!d.r) snd({ t: 'w_hi', to: d.from, n: V.av.name, av: V.av, h: net.host ? 1 : 0, r: 1 });
    if(net.wait) waitRoom();
    else if(net.host && mode === 'dung' && state === 'play')
      snd({ t: 'd_go', to: d.from, fl: dung.floor, sd: dung.seed, rk: dung.curRoomKey, cl: Object.keys(dung.rooms).filter(k => dung.rooms[k].cleared) });
  }
  else if(d.t === 'd_go'){ if(net.wait) beginDung(d.fl, d.sd, d.rk, d.cl); }
  else if(d.t === 'h' && net.host){
    const e = enemies.find(q => q.id === d.id);
    if(e && !e.dead) dmg(e, d.d, d.from);
  }
  else if(d.t === 'c'){
    V.coins += d.n; num(d.x, d.y - 10, '+' + d.n, '#ffd23f');
    sCoin(); missionEvent('kill', d.k); missionEvent('coin', 0, d.n);
  }
  else if(d.t === 'left'){ delete net.rem[d.id]; if(net.wl) delete net.wl[d.id]; if(net.wait) waitRoom(); }
  else if(d.t === 'host'){
    net.host = true; nid = enemies.reduce((a, e) => Math.max(a, e.id), 0) + 1;
    if(net.wl && net.wl[net.id]) net.wl[net.id].h = 1;
    if(net.wait){ snd({ t: 'w_hi', n: V.av.name, av: V.av, h: 1, r: 1 }); waitRoom(); }
  }
}

const DEFAULT_SERVER = 'wss://shooter-nhyt.onrender.com';
const raw = o => { if(net.ws && net.ws.readyState === 1) net.ws.send(JSON.stringify(o)); };

function connect(url){
  let w, ok = false, done = false, tm;
  const fail = m => { if(done) return; done = true; clearTimeout(tm); try{ w.close(); }catch(e){} online(m); };
  try{ w = new WebSocket(url); } catch(e){ return online('Dirección inválida. Debe empezar con wss://'); }
  net.ws = w; net.abort = () => { done = true; clearTimeout(tm); try{ w.close(); }catch(e){} };
  panel(`<h2>CONECTANDO</h2><div class=load><i></i><i></i><i></i><i></i></div><div class=r>${esc(url)}</div><div class=r><small>El servidor gratis de Render puede tardar hasta 1 minuto en despertar.</small></div><button data-a=cancel>✖ CANCELAR</button>`);
  tm = setTimeout(() => { if(!ok) fail('Sin respuesta tras 90s. Abrí la URL en otra pestaña para despertarlo.'); }, 90000);
  w.onopen = () => {
    ok = true; clearTimeout(tm); raw({ t: 'list' });
  };
  w.onerror = () => { if(!ok) fail('Error de conexión. Revisá la URL o escudos del navegador.'); };
  w.onclose = ev => {
    if(!ok) fail('Conexión cerrada (' + ev.code + ').');
    else if(net.on){ net.on = false; main('Se perdió la conexión'); }
    else if(net.lob){ net.lob = false; online('Servidor desconectado'); }
  };
  w.onmessage = ev => {
    let d; try{ d = JSON.parse(ev.data); } catch(e){ return; }
    if(d.t === 'rooms'){
      net.rooms = d.l;
      if(!net.on){ if(!net.lob){ net.lob = true; lobby(); } else updRooms(); }
    }
    else if(d.t === 'full') lobby('Esa sala está llena');
    else if(d.t === 'welcome'){
      net.lob = false; net.id = d.id; net.host = d.host; net.on = true; net.rem = {};
      if(net.mode === 'dung') enterWait(); else start(net.mode, 1);
    }
    else onNet(d);
  };
}

function shd(hex, f){
  const n = parseInt(String(hex).slice(1, 7), 16);
  if(isNaN(n)) return hex;
  const m = f < 0 ? 0 : 255, k = Math.abs(f), q = v => Math.round(v + (m - v) * k);
  return '#' + ((1 << 24) + (q(n >> 16) << 16) + (q((n >> 8) & 255) << 8) + q(n & 255)).toString(16).slice(1);
}

// Dibujo de salas de Mazmorra (TBOI)
function drawDungeonRoom(){
  const r = dung.curRoom, th = dung.floorTheme;
  if(!r) return;
  const rw = r.w * T, rh = r.h * T;

  // Suelo con variación sutil
  for(let ty = 0; ty < r.h; ty++){
    for(let tx = 0; tx < r.w; tx++){
      const hh = hash(tx + r.x * 31, ty + r.y * 17);
      g.fillStyle = (tx + ty) % 2 === 0 ? th.fCol : th.fCol2;
      g.fillRect(tx * T - camx, ty * T - camy, T, T);
      if(hh > .82){ g.fillStyle = 'rgba(255,255,255,.035)'; g.fillRect(tx * T - camx + 3, ty * T - camy + 3, 5, 1); }
      else if(hh < .1){ g.fillStyle = 'rgba(0,0,0,.18)'; g.fillRect(tx * T - camx + 6, ty * T - camy + 8, 4, 3); }
    }
  }

    g.fillStyle = '#5b1620'; g.fillRect(rx0, ry0, 8 * T, 4 * T);
    g.fillStyle = '#d4a017'; g.fillRect(rx0, ry0, 8 * T, 2); g.fillRect(rx0, ry0 + 4 * T - 2, 8 * T, 2); g.fillRect(rx0, ry0, 2, 4 * T); g.fillRect(rx0 + 8 * T - 2, ry0, 2, 4 * T);
    g.fillStyle = 'rgba(0,0,0,.2)'; g.fillRect(rx0 + 4, ry0 + 4, 8 * T - 8, 2);
  }
  // Marcas del suelo (huesos, grietas, sangre, runas, lava...)
  for(const d of r.dec){
    const X = d.x * T - camx, Y = d.y * T - camy;
    if(d.t === 'bone'){ g.fillStyle = '#cbd5e1'; g.fillRect(X + 3, Y + 8, 8, 2); g.fillRect(X + 2, Y + 7, 2, 4); g.fillRect(X + 10, Y + 7, 2, 4); }
    else if(d.t === 'crack'){ g.fillStyle = 'rgba(0,0,0,.45)'; g.fillRect(X + 2, Y + 4, 5, 1); g.fillRect(X + 6, Y + 5, 1, 4); g.fillRect(X + 6, Y + 8, 5, 1); }
    else if(d.t === 'blood'){ g.fillStyle = 'rgba(160,20,30,.5)'; g.fillRect(X + 3, Y + 5, 9, 5); g.fillRect(X + 5, Y + 3, 4, 9); }
    else if(d.t === 'moss'){ g.fillStyle = 'rgba(120,255,80,.26)'; g.fillRect(X + 2, Y + 6, 10, 6); g.fillRect(X + 5, Y + 4, 5, 3); }
    else if(d.t === 'skull'){ g.fillStyle = '#e2e8f0'; g.fillRect(X + 5, Y + 5, 6, 5); g.fillStyle = '#0f172a'; g.fillRect(X + 6, Y + 7, 1, 1); g.fillRect(X + 9, Y + 7, 1, 1); }
    else if(d.t === 'rune'){ g.fillStyle = 'rgba(160,100,255,' + (.25 + .15 * Math.sin(t * 2 + d.x)) + ')'; g.fillRect(X + 3, Y + 3, 10, 1); g.fillRect(X + 3, Y + 12, 10, 1); g.fillRect(X + 3, Y + 3, 1, 10); g.fillRect(X + 12, Y + 3, 1, 10); g.fillRect(X + 7, Y + 6, 2, 4); }
    else if(d.t === 'lava'){ g.fillStyle = 'rgba(255,110,20,' + (.3 + .2 * Math.sin(t * 3 + d.y)) + ')'; g.fillRect(X + 2, Y + 6, 6, 1); g.fillRect(X + 7, Y + 7, 1, 5); g.fillRect(X + 7, Y + 11, 6, 1); }
  }

  // Paredes con ladrillos
  const wall = (x, y, w, h) => {
    g.fillStyle = th.wCol; g.fillRect(x - camx, y - camy, w, h);
    g.fillStyle = 'rgba(0,0,0,.28)';
    for(let yy = 0; yy < h; yy += 5){
      g.fillRect(x - camx, y + yy - camy, w, 1);
      for(let xx = ((yy / 5) % 2) * 6; xx < w; xx += 12) g.fillRect(x + xx - camx, y + yy - camy, 1, 5);
    }
    g.fillStyle = 'rgba(255,255,255,.06)'; g.fillRect(x - camx, y - camy, w, 1);

    if(d.t === 'torch'){ const fl = Math.round(Math.sin(t * 12 + d.x)); g.fillStyle = '#78350f'; g.fillRect(X + 7, Y + 6, 2, 6); g.fillStyle = '#f97316'; g.fillRect(X + 6, Y + 2 + fl, 4, 5); g.fillStyle = '#fde047'; g.fillRect(X + 7, Y + 3 + fl, 2, 3); }
    else if(d.t === 'banner'){ g.fillStyle = d.c; g.fillRect(X + 4, Y + 1, 8, 12); g.fillStyle = 'rgba(0,0,0,.3)'; g.fillRect(X + 4, Y + 11, 3, 2); g.fillRect(X + 9, Y + 11, 3, 2); g.fillStyle = '#d4a017'; g.fillRect(X + 7, Y + 4, 2, 4); }
  }

  // Puertas
  const midX = Math.floor(r.w / 2) * T;
  const midY = Math.floor(r.h / 2) * T;
  const typeCol = type => type === 'boss' ? '#ef4444' : type === 'treasure' ? '#ffd23f' : type === 'shop' ? '#38d66b' : type === 'fountain' ? '#38bdf8' : type === 'challenge' ? '#f97316' : '#7df9ff';
  const drawDoorFrame = (x, y, isHoriz, open, type) => {
    const col = typeCol(type);
    g.fillStyle = '#070914';
    g.fillRect(x - camx, y - camy, isHoriz ? 32 : 16, isHoriz ? 16 : 32);
    if(open){
      g.fillStyle = '#1e1b4b';
      g.fillRect(x + 2 - camx, y + 2 - camy, isHoriz ? 28 : 12, isHoriz ? 12 : 28);
      g.fillStyle = col;
      g.fillRect(x + 4 - camx, y + 4 - camy, isHoriz ? 24 : 8, isHoriz ? 8 : 24);
    } else {
      g.fillStyle = '#475569';
      g.fillRect(x + 2 - camx, y + 2 - camy, isHoriz ? 28 : 12, isHoriz ? 12 : 28);
      g.fillStyle = '#94a3b8';
      for(let i = 0; i < 4; i++){
        if(isHoriz) g.fillRect(x + 6 + i * 6 - camx, y + 2 - camy, 2, 12);
        else g.fillRect(x + 2 - camx, y + 6 + i * 6 - camy, 12, 2);
      }
    }
  };
  if(r.doors.n) drawDoorFrame(midX - 16, 0, true, r.cleared, dung.rooms[`${r.x},${r.y - 1}`]?.type);
  if(r.doors.s) drawDoorFrame(midX - 16, rh - 16, true, r.cleared, dung.rooms[`${r.x},${r.y + 1}`]?.type);
  if(r.doors.w) drawDoorFrame(0, midY - 16, false, r.cleared, dung.rooms[`${r.x - 1},${r.y}`]?.type);
  if(r.doors.e) drawDoorFrame(rw - 16, midY - 16, false, r.cleared, dung.rooms[`${r.x + 1},${r.y}`]?.type);

  // Pinchos
  for(const s_ of r.spk){
    const X = s_.x * T - camx, Y = s_.y * T - camy, st = spkState(s_);
    g.fillStyle = '#0a0a14'; g.fillRect(X + 2, Y + 2, 12, 12);
    for(let i = 0; i < 4; i++){
      const sx = X + 3 + (i % 2) * 6, sy = Y + 3 + (i >> 1) * 6;
      if(st === 0){ g.fillStyle = '#1e293b'; g.fillRect(sx + 1, sy + 1, 2, 2); }
      else if(st === 1){ g.fillStyle = '#ef4444'; g.fillRect(sx + 1, sy, 2, 3); }
      else { g.fillStyle = '#e2e8f0'; g.fillRect(sx, sy + 2, 3, 5); g.fillRect(sx + 1, sy, 1, 2); }
    }
  }
  // Obstáculos
  for(const o of r.obs){
    const X = o.x * T - camx, Y = o.y * T - camy;
    g.fillStyle = 'rgba(0,0,0,.3)'; g.fillRect(X, Y + T - 2, T, 4);
    g.fillStyle = th.obsCol; g.fillRect(X, Y - 2, T, T);
    g.fillStyle = 'rgba(255,255,255,.18)'; g.fillRect(X + 1, Y - 1, T - 2, 2);
    g.fillStyle = 'rgba(0,0,0,.25)'; g.fillRect(X, Y + T - 5, T, 3); g.fillRect(X + 8, Y + 2, 1, 6);
  }
  // Fuente curativa
  if(r.type === 'fountain'){
    const fx0 = (r.w / 2) * T - camx, fy0 = (r.h / 2) * T - camy;
    g.fillStyle = '#334155'; g.fillRect(fx0 - 14, fy0 - 8, 28, 20);

      g.fillStyle = '#bae6fd'; g.fillRect(fx0 - 8 + w_, fy0 - 2, 5, 1); g.fillRect(fx0 + 2 - w_, fy0 + 3, 6, 1);
      g.fillStyle = '#7dd3fc'; g.fillRect(fx0 - 1, fy0 - 14, 2, 9); g.fillRect(fx0 - 3, fy0 - 12, 6, 1);
    }
  }

  // Pedestales y Objetos
  for(const ped of dung.pedestals){
    const px = ped.x - camx, py = ped.y - camy;
    g.fillStyle = '#334155'; g.fillRect(px - 8, py - 3, 16, 8);
    g.fillStyle = '#64748b'; g.fillRect(px - 6, py - 6, 12, 4);

    const bob = Math.sin(t * 6) * 3;
    if(ped.item && ped.item.t === 'relic'){
      const rel = RELICS[ped.item.i];
      g.fillStyle = rel.col;
      g.beginPath(); g.arc(px, py - 14 + bob, 5, 0, 6.28); g.fill();
      TX(rel.ic, (px - 6) + camx, (py - 10 + bob) + camy, 4, '#fff');

      TX('$' + ped.shop.pr, px + camx, py - 18 + camy, 3.5, '#ffd23f', 'center');

  // Trampilla al siguiente piso
  if(dung.trapdoor){
    const tx = dung.trapdoor.x - camx, ty = dung.trapdoor.y - camy;

    g.fillStyle = '#0f172a'; g.fillRect(tx - 4, ty - 4, 8, 8);
  }
}

// Minimapa estilo The Binding of Isaac
function drawDungeonMinimap(){
  const size = 9, pad = 3;
  const startX = W - 58, startY = 8;
  const curR = dung.curRoom;

  hg.fillStyle = 'rgba(10, 14, 30, 0.75)';
  hg.strokeStyle = '#3b4a8a';
  hg.lineWidth = 1;
  hg.strokeRect((startX - 4) * hs, (startY - 4) * hs, 54 * hs, 50 * hs);
  hg.fillRect((startX - 4) * hs, (startY - 4) * hs, 54 * hs, 50 * hs);

  for(const k in dung.rooms){
    const r = dung.rooms[k];
    const dx = r.x - curR.x, dy = r.y - curR.y;
    if(Math.abs(dx) > 2 || Math.abs(dy) > 2) continue;

    const mx = startX + 22 + dx * (size + pad);
    const my = startY + 20 + dy * (size + pad);

    if(r.visited){
      const isCur = (r === curR);
      hg.fillStyle = isCur ? '#ffd23f' : r.type === 'boss' ? '#ef4444' : r.type === 'treasure' ? '#a855f7' : r.type === 'shop' ? '#38d66b' : r.type === 'fountain' ? '#38bdf8' : r.type === 'challenge' ? '#f97316' : '#475569';
      hg.fillRect(mx * hs, my * hs, size * hs, size * hs);

      if(isCur){
        hg.strokeStyle = '#fff';
        hg.lineWidth = Math.max(1, hs * 0.6);
        hg.strokeRect((mx - 1) * hs, (my - 1) * hs, (size + 2) * hs, (size + 2) * hs);
      }
    } else {
      const isAdj = DIRS.some(d => dung.rooms[`${r.x + d.dx},${r.y + d.dy}`]?.visited);
      if(isAdj){
        hg.strokeStyle = '#334155';
        hg.lineWidth = 1;
        hg.strokeRect(mx * hs, my * hs, size * hs, size * hs);
      }
    }
  }
}
