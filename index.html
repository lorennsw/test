    R(1, -2, 14, 18, '#0c0e1c'); R(1, -2, 14, 2, '#7df9ff'); R(1, -2, 2, 18, '#7df9ff'); R(13, -2, 2, 18, '#7df9ff');
    R(5, 4, 6, 8, Math.sin(t * 4) > 0 ? '#7df9ffcc' : '#7df9ff77');
  } else {
    R(1, -2, 14, 18, '#6b4423'); R(1, 3, 14, 2, '#2a2a2a'); R(1, 11, 14, 2, '#2a2a2a'); R(6, 5, 4, 6, '#c9a227'); R(7, 7, 2, 2, '#111');
  }
}
function drawArrow(){
  if(!key || !door) return;
  const sx = door.x - camx, sy = door.y - camy;
  let ax, ay, an;
  if(sx > 10 && sx < W - 10 && sy > 10 && sy < H - 10){ ax = sx; ay = sy - 18 + Math.sin(t * 5) * 2; an = Math.PI / 2; }
  else {
    const dx = sx - W / 2, dy = sy - H / 2, k = Math.min((W / 2 - 12) / (Math.abs(dx) || .001), (H / 2 - 12) / (Math.abs(dy) || .001));
    ax = W / 2 + dx * k; ay = H / 2 + dy * k; an = Math.atan2(dy, dx);
  }
  hg.save(); hg.translate(ax * hs, ay * hs); hg.rotate(an);
  const z = 6 * hs;
  hg.beginPath(); hg.moveTo(z, 0); hg.lineTo(-z * .7, -z * .8); hg.lineTo(-z * .3, 0); hg.lineTo(-z * .7, z * .8); hg.closePath();
  hg.fillStyle = '#ffe66d'; hg.fill(); hg.lineWidth = Math.max(1, hs * .4); hg.strokeStyle = '#000'; hg.stroke(); hg.restore();
}
function draw(){
  hudPrep();
  let fx = p.x, fy = p.y;
  if(state === 'menu'){
    fx = MW * T / 2 + Math.cos(t * .15) * 220; fy = MH * T / 2 + Math.sin(t * .12) * 120;
  }

  // Cámara fija en Mazmorras vs cámara de seguimiento en supervivencia
  if(mode === 'dung' && dung.curRoom){
    const rw = dung.curRoom.w * T, rh = dung.curRoom.h * T;
    camx = Math.max(0, Math.min(rw - W, Math.round(fx - W / 2)));
    camy = Math.max(0, Math.min(rh - H, Math.round(fy - H / 2)));
  } else {
    camx = Math.max(0, Math.min(MW * T - W, Math.round(fx - W / 2)));
    camy = Math.max(0, Math.min(MH * T - H, Math.round(fy - H / 2)));
  }

  const R = (x, y, w, h, col) => {
    g.fillStyle = col; g.fillRect(Math.round(x - camx), Math.round(y - camy), w, h);
  };

  const dr = [];
  if(mode === 'dung'){
    drawDungeonRoom();
  } else {
    const x0 = Math.floor(camx / T), x1 = Math.ceil((camx + W) / T);
    const y0 = Math.floor(camy / T), y1 = Math.ceil((camy + H) / T);
    for(let ty = y0; ty <= y1 + 1; ty++) for(let tx = x0; tx <= x1; tx++){
      if(tx < 0 || ty < 0 || tx >= MW || ty >= MH) continue;
      const k = m[ty * MW + tx], X = tx * T, Y = ty * T, h = hash(tx, ty);
      if(k === 2){
        R(X, Y, T, T, pal.w);
        const o = Math.floor(t * 3 + h * 9) % 4; R(X + 3 + o * 2, Y + 4, 4, 1, pal.wl);
      } else {
        R(X, Y, T, T, h < .5 ? pal.a : pal.b);
        if(h > .7) R(X + 4 + h * 6, Y + 5, 1, 3, pal.t);
        if(h < .04) R(X + 7, Y + 7, 2, 2, '#ffe66d'); else if(h > .96) R(X + 5, Y + 9, 2, 2, '#ff6b9d');
        if(k === 1) dr.push({ y: Y + T, f: () => drawTree(X, Y) });
        if(k === 3) dr.push({ y: Y + T, f: () => drawDoor(X, Y) });
      }
    }
  }

  // Renderizar entidades ordenadas por Y
  for(const e of enemies) dr.push({ y: e.y, f: () => drawEnemy(e) });
  if(mode === 'dung' && dung.curRoom) for(const q of dung.curRoom.props) if(!q.dead) dr.push({ y: q.y * T + T, f: () => drawProp(q) });
  if(net.on) for(const id in net.rem){
    const r = net.rem[id];
    if(r.av && r.dd && (mode !== 'dung' || r.rk === dung.curRoomKey)) dr.push({ y: r.y, f: () => { drawGrave(r.x, r.y); TX(r.name || '', r.x - camx, r.y - camy - 24, 3.2, '#9ca3af', 'center'); } });
  }
  if(p.dead > 1000) dr.push({ y: p.y, f: () => drawGrave(p.x, p.y) });
  if(pet) dr.push({ y: pet.y, f: () => drawPet(g, Math.round(pet.x - camx), Math.round(pet.y - camy), pet.ty, pet.t) });

  for(const q of coins) dr.push({
    y: q.y, f: () => {
      const w = 2 + Math.abs(Math.sin(t * 6 + q.x)) * 2, b = Math.round(Math.sin(t * 5 + q.y));
      R(q.x - w / 2, q.y - 4 + b, w, 4, '#ffd23f');
    }
  });

  for(const h of hearts) dr.push({
    y: h.y, f: () => {
      const b = Math.sin(t * 5) * 1.5;
      R(h.x - 3, h.y - 7 + b, 6, 5, '#e43b44');
    }
  });

  for(const id in net.rem){
    const r = net.rem[id];
    const sameRoom = (mode !== 'dung') || (r.rk === dung.curRoomKey);
    if(r.av && !r.dd && sameRoom) dr.push({
      y: r.y, f: () => {
        drawChar(g, Math.round(r.x - camx), Math.round(r.y - camy), r, r.av);
        TX(r.name || '', r.x - camx, r.y - camy - 22, 3.4, '#fff', 'center');
      }
    });
  }

  if(state !== 'menu' && !p.dead && !(p.inv > 0 && Math.floor(t * 20) % 2)){
    dr.push({ y: p.y, f: () => drawChar(g, Math.round(p.x - camx), Math.round(p.y - camy), { ...p, arm: V.arm, w: V.eq }, V.av) });
  }

  dr.sort((a, b) => a.y - b.y).forEach(d => d.f());
  if(mode === 'dung' && state !== 'menu') drawDungeonFx();

  for(const b of bullets) R(b.x - 1, b.y - 1, 3, 3, b.col || '#ffe66d');
  for(const b of eb) R(b.x - b.r, b.y - b.r, b.r * 2, b.r * 2, b.c || '#ff4d6d');
  for(const w of shw){
    g.strokeStyle = 'rgba(255,255,255,' + Math.max(.2, w.l / .6) + ')';
    g.lineWidth = 2; g.beginPath(); g.arc(w.x - camx, w.y - camy, w.r, 0, 6.283); g.stroke();
  }
  for(const q of parts) R(q.x, q.y, 2, 2, q.col);
  for(const n of nums) TX(n.s, n.x - camx, n.y - camy, 4.5, n.c, 'center');

  if(state === 'menu') return;

  // Corazones de vida
  const maxHearts = Math.max(5, p.maxHp || 5);
  for(let i = 0; i < maxHearts; i++){
    g.fillStyle = i < p.hp ? '#e43b44' : '#2d1520';
    g.fillRect(4 + i * 9, 4, 7, 6); g.fillRect(5 + i * 9, 10, 5, 1);
  }
  for(let i = 0; i < (p.ar || 0); i++){
    g.fillStyle = '#7df9ff'; g.fillRect(4 + (maxHearts + i) * 9, 4, 7, 7);
  }

  g.fillStyle = '#ffd23f'; g.fillRect(4, 14, 5, 5);
  TX(V.coins, 12, 19, 4.5, '#fff');

  if(mode === 'dung'){
    TX('PISO ' + dung.floor + ': ' + dung.floorTheme.n.toUpperCase(), W / 2, 9, 4.2, '#ffd23f', 'center');
    const rr_ = dung.curRoom;
    if(rr_ && !rr_.cleared) TX('ENEMIGOS: ' + enemies.length + (rr_.waves > 1 ? '   OLEADA ' + Math.max(1, rr_.wave) + '/' + rr_.waves : ''), W / 2, 17, 3.6, '#ff9d9d', 'center');
    if(dung.passives.length > 0){
      dung.passives.forEach((pi, idx) => {
        const rel = RELICS[pi];
        TX(rel.ic, 4 + idx * 10, H - 12, 4.2, '#fff');
      });
    }
    drawDungeonMinimap();
  } else {
    TX(mode === 'camp' ? 'BAJAS ' + kills : 'OLEADA ' + (1 + Math.floor(kills / 10)), W - 17, 9, 3.8, '#fff', 'right');
    if(ms) TX('MISIÓN: ' + ms.t + (ms.done ? ' OK' : ' ' + Math.floor(ms.v) + '/' + ms.n), 4, 28, 3.6, ms.done ? '#7df9a0' : '#cfe8ff');
    if(mode === 'camp'){
      if(key) TX('LLAVE OK', 4, 35, 3.6, '#ffe66d');
      if(!isBossLvl()){
        const bw = 130, bx = 95, pr = Math.max(0, Math.min(1, kills / goal()));
        g.fillStyle = '#000'; g.fillRect(bx - 1, 2, bw + 2, 10);
        g.fillStyle = '#222a44'; g.fillRect(bx, 3, bw, 8);
        g.fillStyle = '#38b764'; g.fillRect(bx, 3, Math.round(bw * pr), 8);
        TX('NIVEL ' + lvl + '  ' + Math.min(kills, goal()) + '/' + goal(), bx + bw / 2, 9.5, 3.6, '#fff', 'center');
      } else {
        TX('NIVEL ' + lvl + ' · JEFE', W / 2, 9, 3.8, '#ffd23f', 'center');
      }
      const hint = key ? 'ANDÁ A LA PUERTA' : (goalDone() ? 'COMPLETÁ LA MISIÓN' : '');
      if(hint) TX(hint, W / 2, 21, 3.6, '#ffe66d', 'center');
    }
    drawMini();
    if(mode === 'camp') drawArrow();
  }

  if(boss && !boss.dead){
    const bw = 140, bx = (W - bw) / 2;
    g.fillStyle = '#000'; g.fillRect(bx - 1, 14, bw + 2, 8);
    g.fillStyle = '#1e1b4b'; g.fillRect(bx, 15, bw, 6);
    g.fillStyle = '#ef4444'; g.fillRect(bx, 15, Math.round(bw * Math.max(0, boss.hp / boss.mx)), 6);
    TX(EN[boss.k].n.toUpperCase(), W / 2, 13, 3.4, '#ffd23f', 'center');
  }

  TX((V.eq + 1) + ' ' + WP[V.eq].n.toUpperCase(), 4, H - 4, 3.8, WP[V.eq].col);

  if(bn.l > 0){
    hg.globalAlpha = Math.min(1, bn.l);
    TX(bn.s, W / 2, 54, 7.5, '#ffe66d', 'center');
    hg.globalAlpha = 1;
  }

  drawReviveHud();
  if(state === 'play' && !paused){
    g.fillStyle = '#fff';
    g.fillRect(mx - 4, my, 3, 1); g.fillRect(mx + 2, my, 3, 1);
    g.fillRect(mx, my - 4, 1, 3); g.fillRect(mx, my + 2, 1, 3);
  }
}

let last = 0;
function loop(ts){
  requestAnimationFrame(loop);
  const dt = Math.min(.05, (ts - last) / 1000 || 0);
  last = ts;
  try{ update(dt); draw(); }catch(err){ console.error('Error en el bucle del juego:', err); }
}

function icon(x, k, i, ox, oy){
  const Q = (a, b, w, h, c) => { x.fillStyle = c; x.fillRect(a + (ox || 0), b + (oy || 0), w, h); };
  if(k === 'w'){
    const w = WP[i] || WP[0];
    Q(3, 11, 18, 5, '#666'); Q(3, 15, 6, 7, '#555'); Q(17, 10, 5, 3, w.col); Q(5, 9, 8, 2, '#888');
    if(w.pel > 1){ Q(19, 8, 3, 1, w.col); Q(19, 14, 3, 1, w.col); }
  } else if(k === 'a'){
    const a = ARM[i];
    Q(6, 6, 12, 14, a.col); Q(2, 5, 5, 5, a.col); Q(17, 5, 5, 5, a.col);
  } else drawPet(x, 12 + (ox || 0), 21 + (oy || 0), i, 0);
}

function drawPet(cx, X, Y, ty, tt){
  const Q = (dx, dy, w, h, col) => { cx.fillStyle = col; cx.fillRect(Math.round(X + dx), Math.round(Y + dy), w, h); };
  const b = Math.round(Math.sin(tt * 8));
  Q(-4, -1, 8, 2, 'rgba(0,0,0,.3)');
  if(ty === 0){
    Q(-3, -5, 6, 3, '#c68642'); Q(-6, -7, 4, 4, '#c68642'); Q(-5, -6, 1, 1, '#111');
  } else if(ty === 1){
    Q(-3, -12 + b, 6, 6, '#8d8d9b'); Q(-2, -11 + b, 2, 2, '#fff');
  } else {
    Q(-2, -12 + b, 4, 4, '#ff9ecf'); Q(-5, -12 + b, 3, 2, '#bde7ffcc');
  }
}

function newMission(i){
  const pool = MT.filter(m => m.k !== 'kill' || EN[m.ty].u <= tier());
  const m = { ...(i == null ? pool[rnd(0, pool.length-1)] : MT[i]) };
  m.v = 0; m.done = false; m.r = rnd(20, 45); m.next = 5;
  return m;
}
function chk(){
  if(ms && !ms.done && ms.v >= ms.n){
    ms.done = true; V.coins += ms.r; banner('MISIÓN CUMPLIDA +' + ms.r); sCoin(); save();
  }
}
function missionEvent(k, ty, a){
  const m = ms; if(!m || m.done) return;
  if(k === 'hurt'){ if(m.k === 'streak') m.v = 0; return; }
  if(m.k === 'kill' && k === 'kill' && ty === m.ty) m.v++;
  else if((m.k === 'any' || m.k === 'streak') && k === 'kill') m.v++;
  else if(m.k === 'coin' && k === 'coin') m.v += a || 1;
  chk();
}
function missionTick(dt){
  if(!ms) return;
  if(ms.k === 'time' && !ms.done){ ms.v += dt; chk(); }
  if(ms.done && mode === 'surv' && (ms.next -= dt) <= 0) ms = newMission();
}

function petTick(dt){
  if(V.pet < 0){ pet = null; return; }
  if(!pet || pet.ty !== V.pet) pet = { x: p.x, y: p.y, cd: 1, t: 0, ty: V.pet, hl: 25 };
  const k = Math.min(1, dt * 4);
  pet.x += (p.x - 12 - pet.x) * k; pet.y += (p.y + 3 - pet.y) * k; pet.t += dt;
  if(p.dead) return;
  if(pet.ty === 1){
    pet.cd -= dt;
    if(pet.cd <= 0){
      let b = null, bm = 130;
      for(const e of enemies){
        const d = Math.hypot(e.x - pet.x, e.y - pet.y);
        if(d < bm){ bm = d; b = e; }
      }
      if(b){
        const a = Math.atan2(b.y - EN[b.k].cy - (pet.y - 8), b.x - pet.x);
        bullets.push({ x: pet.x, y: pet.y - 8, vx: Math.cos(a) * 200, vy: Math.sin(a) * 200, l: .8, d: 1, col: '#cfcfff' });
        pet.cd = 1.3;
      } else pet.cd = .3;
    }
  }
  if(pet.ty === 2){
    pet.hl -= dt;
    if(pet.hl <= 0){
      if(p.hp < (p.maxHp || 5)){ p.hp++; num(p.x, p.y - 26, '+1', '#ff6b9d'); }
      pet.hl = 25;
    }
  }
}

  },
  un: v => { if(v == 'a') V.arm = -1; if(v == 'p') V.pet = -1; save(); shop(); },
  buyi: (v, k) => {
    const L = k == 'w' ? WP : k == 'a' ? ARM : PETS, o = k == 'w' ? V.owned : k == 'a' ? V.armo : V.peto, i = +v;
    if(V.coins >= L[i].pr){ V.coins -= L[i].pr; o.push(i); A.eqi(v, k); }

// ---------- EVENTOS Y CONTROLES ----------
addEventListener('keydown', e => {
  const k = e.key.toLowerCase(); keys[k] = true;
  const pl = state === 'play' && !open();
  if(pl && k === 'm') mini = !mini;
  if(k === 'f' && !(e.target && e.target.tagName === 'INPUT')) toggleFS();
  if(k === ' ' && pl) e.preventDefault();
  if(k === 'escape' && state === 'play'){ paused ? A.resume() : pauseMenu(); }
  if(pl && k >= '1' && k <= '5'){ const i = +k - 1; if(V.owned.includes(i)) V.eq = i; }
  if(pl && k === 'b' && mode !== 'dung'){ paused = true; ret = pauseMenu; shop(); }
});
addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

const pos = e => {
  const r = c.getBoundingClientRect();
  return [(e.clientX - r.left) / r.width * W, (e.clientY - r.top) / r.height * H];
};

c.addEventListener('pointerdown', e => {
  initAudio(); const [x, y] = pos(e);
  if(e.pointerType === 'touch'){
    c.setPointerCapture(e.pointerId);
    if(x < W / 2){ stickId = e.pointerId; stick = { x: 0, y: 0, ox: x, oy: y }; }
    else { aimId = e.pointerId; mx = x; my = y; mdown = true; }
  } else {
    mdown = true;
    try{ const r = c.requestPointerLock(); r && r.catch && r.catch(() => {}); }catch(er){}
  }
});

c.addEventListener('pointermove', e => {
  if(e.pointerType === 'mouse'){
    const r = c.getBoundingClientRect(), k = W / r.width * S.sens;
    mx = Math.max(0, Math.min(W, mx + e.movementX * k));
    my = Math.max(0, Math.min(H, my + e.movementY * k));
  } else {
    const [x, y] = pos(e);
    if(e.pointerId === stickId){
      const dx = x - stick.ox, dy = y - stick.oy, l = Math.hypot(dx, dy) || 1, k = Math.min(1, l / 25);
      stick.x = dx / l * k; stick.y = dy / l * k;
    } else if(e.pointerId === aimId){ mx = x; my = y; }
  }
});

const up = e => {
  if(e.pointerId === stickId){ stick = null; stickId = null; }
  else { mdown = false; aimId = null; }
};
addEventListener('pointerup', up);
c.addEventListener('pointercancel', up);
c.addEventListener('contextmenu', e => e.preventDefault());

document.addEventListener('pointerlockchange', () => {
  if(!document.pointerLockElement && state === 'play' && !open()) pauseMenu();
});

const fsb = document.getElementById('fs'), isFS = () => document.fullscreenElement || document.webkitFullscreenElement;

    else(el.requestFullscreen || el.webkitRequestFullscreen).call(el);

}

};
fsb.addEventListener('click', e => { toggleFS(); e.target.blur(); });
document.addEventListener('fullscreenchange', fsUpd);
document.addEventListener('webkitfullscreenchange', fsUpd);
